<html lang="en">
<head>
<meta charset="utf-8">

<title>Krate — Home</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;family=Jost:wght@400;500;600&amp;family=Pinyon+Script&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
img{display:block;max-width:100%}
a{color:#1D6A5A}
:focus-visible{outline:3px solid #C9A55A;outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{max-width:1280px;margin-left:auto;margin-right:auto;padding-left:clamp(20px,5vw,72px);padding-right:clamp(20px,5vw,72px)}
.nav-links{display:flex}
.nav-toggle{display:none}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,96px);align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(24px,3vw,40px)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,20px)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.bleed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.bleed-media{position:relative;min-height:600px}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px}
[data-track]{scrollbar-width:none}
[data-track]::-webkit-scrollbar{display:none}
.zoom img{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.zoom:hover img{transform:scale(1.04)}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-30%)}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.drift{animation:drift 70s ease-in-out infinite alternate}
.marquee{animation:marquee 46s linear infinite}
.rise{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}
.rise-2{animation-delay:.2s}
.rise-3{animation-delay:.45s}
@media (max-width:1000px){.foot{grid-template-columns:1fr 1fr}}
@media (max-width:900px){.split{grid-template-columns:1fr}.bleed{grid-template-columns:1fr}.bleed-media{min-height:0;aspect-ratio:4/3}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.nav-links{display:none}.nav-toggle{display:inline-flex}}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.grid3{grid-template-columns:1fr}.foot{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.drift,.marquee,.rise{animation:none}.zoom img{transition:none}html{scroll-behavior:auto}}
</style>

; background: linear-gradient(160deg, #165047, #0A211D); color: #F2F5F3; text-decoration: none\">\n<span style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(30px, 2.6vw, 36px); line-height: 1.06; font-weight: 600\">Your venue could be next.<\/span>\n<span style=\"margin-top: 12px; font-size: 16px; color: #A9BDB7\">Private, corporate and festival performances, shaped around your occasion.<\/span>\n<span style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border-radius: 999px; text-decoration: none; font-weight: 600; background: #C9A55A; color: #0E2B27; align-self: flex-start; min-height: 46px; margin-top: 24px; padding: 0 22px\">Plan an event<\/span>\n<\/a>\n<\/div>\n<\/section>\n\n<section id=\"experiences\" aria-labelledby=\"ways-title\" style=\"background: #FFFFFF\">\n<div class=\"wrap\" style=\"padding-top: clamp(80px, 10vw, 128px); padding-bottom: clamp(80px, 10vw, 128px)\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px 48px\">\n<div style=\"flex: 1 1 480px; min-width: 0\"><p style=\"margin: 0 0 16px; font-size: 15px; font-weight: 500; color: #1D6A5A\">The Krate experience<\/p><h2 id=\"ways-title\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(42px, 5vw, 76px); line-height: 1; letter-spacing: -0.005em; color: #18201E\">Three ways to step inside<\/h2><\/div>\n<p style=\"flex: 0 1 420px; margin: 0; font-size: 18px; color: #3C4744\">Each show is built around its venue. Join the role-play as much as you like, or simply watch it unfold around you.<\/p>\n<\/div>\n<div class=\"grid3\" style=\"margin-top: clamp(40px, 5vw, 64px)\">\n<article class=\"zoom\">\n<div style=\"overflow: hidden; aspect-ratio: 4 / 5; border-radius: 50% 50% 6px 6px / 26% 26% 6px 6px\"><img src=\"/_blob/13b280b1e849f314e2a6aa9e86ad4ef3\" alt=\"An actor in a pink kebaya welcomes the audience at the doorway of a Peranakan house\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%\"><\/div>\n<h3 style=\"margin: 26px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(30px, 2.6vw, 36px); line-height: 1.1; font-weight: 600; color: #18201E\">Walk through it<\/h3>\n<p style=\"margin: 10px 0 0; color: #3C4744; max-width: 38ch\">Follow the characters from room to room through a heritage house while the story happens around you.<\/p>\n<p style=\"margin: 12px 0 0; font-size: 15px; color: #4A5754\">As in The Case of the Missing Diamond and The Great Gossip<\/p>\n<\/article>\n<article class=\"zoom\">\n<div style=\"overflow: hidden; aspect-ratio: 4 / 5; border-radius: 50% 50% 6px 6px / 26% 26% 6px 6px\"><img src=\"/_blob/b17d4889ac88a42d64518d97e280ece0\" alt=\"Guests at dinner tables watch a murder-mystery scene unfold\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%\"><\/div>\n<h3 style=\"margin: 26px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(30px, 2.6vw, 36px); line-height: 1.1; font-weight: 600; color: #18201E\">Dine in it<\/h3>\n<p style=\"margin: 10px 0 0; color: #3C4744; max-width: 38ch\">Start with a shared Peranakan meal, then question the suspects, gather clues and solve the case with your group.<\/p>\n<p style=\"margin: 12px 0 0; font-size: 15px; color: #4A5754\">As in A Chef\u2019s Confession<\/p>\n<\/article>\n<article class=\"zoom\">\n<div style=\"overflow: hidden; aspect-ratio: 4 / 5; border-radius: 50% 50% 6px 6px / 26% 26% 6px 6px\"><img src=\"/_blob/8a80b09dfefae77f3a5af24b20a8fcb1\" alt=\"Two performers in 1920s gowns dance with white feather fans\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%\"><\/div>\n<h3 style=\"margin: 26px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(30px, 2.6vw, 36px); line-height: 1.1; font-weight: 600; color: #18201E\">Sing along<\/h3>\n<p style=\"margin: 10px 0 0; color: #3C4744; max-width: 38ch\">Full-scale original musicals, full of familiar tunes from the past, with a cast that pulls you into the scene.<\/p>\n<p style=\"margin: 12px 0 0; font-size: 15px; color: #4A5754\">As in The Best Nyonya and Tears Under the Rising Sun<\/p>\n<\/article>\n<\/div>\n<\/div>\n<\/section>\n\n<section aria-labelledby=\"voices-title\" style=\"position: relative; overflow: hidden; background: #E6F0EB\">\n<div class=\"wrap\" style=\"padding-top: clamp(80px, 10vw, 128px); padding-bottom: clamp(80px, 10vw, 128px)\">\n<h2 id=\"voices-title\" style=\"margin: 0; font-size: 15px; font-weight: 500; color: #1D6A5A\">What audiences and organisers say<\/h2>\n<figure style=\"position: relative; margin: 28px 0 0; max-width: 1000px\">\n<span aria-hidden=\"true\" style=\"position: absolute; left: -6px; top: -48px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 180px; line-height: 1; color: #C23461; opacity: 0.85\">\u201c<\/span>\n<blockquote style=\"position: relative; margin: 0; padding-top: 56px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(32px, 3.8vw, 54px); line-height: 1.14; font-weight: 500; color: #18201E\">New benchmark for RIUH\u2026 very likely one of the most successful cultural events in recent years for the city of Melaka.<\/blockquote>\n<figcaption style=\"margin-top: 22px; font-size: 16px; color: #3C4744\">Alexdrina, main organiser of Riuh Nau, on The Best Nyonya\u2019s 2022 debut<\/figcaption>\n<\/figure>\n<div class=\"grid3\" style=\"margin-top: clamp(48px, 6vw, 72px)\">\n<figure style=\"margin: 0; padding: 32px; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 0 rgba(14, 43, 39, 0.06)\"><blockquote style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #18201E\">\u201cWe laughed, teared a bit and felt the emotions that were delivered. The lighting and sound effects were great too.\u201d<\/blockquote><figcaption style=\"margin-top: 20px; font-size: 15px; color: #4A5754\">Audience member, The Great Gossip<\/figcaption><\/figure>\n<figure style=\"margin: 0; padding: 32px; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 0 rgba(14, 43, 39, 0.06)\"><blockquote style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #18201E\">\u201cSuch a wonderful local production, featuring such a talented, all-female cast. It\u2019s a must see!\u201d<\/blockquote><figcaption style=\"margin-top: 20px; font-size: 15px; color: #4A5754\">Audience member, The Best Nyonya<\/figcaption><\/figure>\n<figure style=\"margin: 0; padding: 32px; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 0 rgba(14, 43, 39, 0.06)\"><blockquote style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #18201E\">\u201cFood was great, venue was great, murder mystery itself was amazing!\u201d<\/blockquote><figcaption style=\"margin-top: 20px; font-size: 15px; color: #4A5754\">Guest, A Chef\u2019s Confession<\/figcaption><\/figure>\n<\/div>\n<\/div>\n<\/section>\n\n<section aria-label=\"Press and partners\" style=\"background: #FFFFFF\">\n<div class=\"wrap split\" style=\"padding-top: clamp(56px, 7vw, 88px); padding-bottom: clamp(56px, 7vw, 88px); align-items: center\">\n<div><h2 style=\"margin: 0 0 20px; font-size: 15px; font-weight: 500; color: #4A5754\">As seen in<\/h2><img src=\"/_blob/e9dccbd3a645e6dd04fb4cb564f51ad2\" alt=\"The Star, The Edge, The Rakyat Post and Sin Chew Daily\" style=\"width: 100%; max-width: 560px; filter: invert(1) grayscale(1)\"><\/div>\n<div><h2 style=\"margin: 0 0 20px; font-size: 15px; font-weight: 500; color: #4A5754\">Worked with<\/h2><img src=\"/_blob/f2770919fd451c2807e38cac03a2138a\" alt=\"Logos including Infineon, MAE by Maybank, OCBC Bank, The Chow Kit, TEDxJonkerStreet and Riuh\" style=\"width: 100%; filter: grayscale(1) contrast(1.05); opacity: 0.85\"><\/div>\n<\/div>\n<\/section>\n\n<section aria-labelledby=\"hire\" style=\"background: #0E2B27; color: #F2F5F3\">\n<div class=\"wrap split\" style=\"padding-top: clamp(80px, 10vw, 128px); padding-bottom: clamp(80px, 10vw, 128px)\">\n<div>\n<p style=\"margin: 0 0 16px; font-size: 15px; font-weight: 500; color: #C9A55A\">Book Krate<\/p>\n<h2 id=\"hire\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(42px, 5vw, 76px); line-height: 1; letter-spacing: -0.005em; font-size: clamp(40px, 4.6vw, 68px); line-height: 1.02\">Bring a Krate show to your venue, team or school.<\/h2>\n<p style=\"margin: 24px 0 0; max-width: 42ch; font-size: 18px; color: #A9BDB7\">Private and corporate performances, a space to hire, art workshops and murals, each shaped around your occasion.<\/p>\n<a href=\"book.html\" style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border-radius: 999px; text-decoration: none; font-weight: 600; background: #C9A55A; color: #0E2B27; margin-top: 36px\">Plan an event with us<\/a>\n<\/div>\n<div class=\"grid2\" style=\"row-gap: 28px\">\n<a href=\"book.html\" class=\"zoom\" style=\"display: block; color: #F2F5F3; text-decoration: none\"><div style=\"overflow: hidden; border-radius: 8px\"><img src=\"/_blob/3157446a5c80afc7f1510c053f39e43a\" alt=\"Cast performing a staged scene for an event audience\" style=\"width: 100%; aspect-ratio: 4 / 3; object-fit: cover\"><\/div><span style=\"display: block; margin-top: 12px; font-size: 17px; font-weight: 500\">Private and corporate shows<\/span><\/a>\n<a href=\"book.html\" class=\"zoom\" style=\"display: block; color: #F2F5F3; text-decoration: none\"><div style=\"overflow: hidden; border-radius: 8px\"><img src=\"/_blob/8e2f963f66a4c3de30bb38891a2cd017\" alt=\"A performance in the Krate event space under stage lights\" style=\"width: 100%; aspect-ratio: 4 / 3; object-fit: cover\"><\/div><span style=\"display: block; margin-top: 12px; font-size: 17px; font-weight: 500\">Event space<\/span><\/a>\n<a href=\"book.html\" class=\"zoom\" style=\"display: block; color: #F2F5F3; text-decoration: none\"><div style=\"overflow: hidden; border-radius: 8px\"><img src=\"/_blob/35a4461ccade34ef47e2e8d914f8323f\" alt=\"Workshop participants holding up their painted artworks\" style=\"width: 100%; aspect-ratio: 4 / 3; object-fit: cover\"><\/div><span style=\"display: block; margin-top: 12px; font-size: 17px; font-weight: 500\">Art workshops<\/span><\/a>\n<a href=\"book.html\" class=\"zoom\" style=\"display: block; color: #F2F5F3; text-decoration: none\"><div style=\"overflow: hidden; border-radius: 8px\"><img src=\"/_blob/12e8c645ffeefa6f30979c2f9d8d4b6b\" alt=\"An artist painting a mural of a traditional house\" style=\"width: 100%; aspect-ratio: 4 / 3; object-fit: cover\"><\/div><span style=\"display: block; margin-top: 12px; font-size: 17px; font-weight: 500\">Art murals<\/span><\/a>\n<\/div>\n<\/div>\n<\/section>\n\n<section id=\"cafe\" aria-labelledby=\"cafe-title\" style=\"background: #E6F0EB\">\n<div class=\"bleed\">\n<div class=\"bleed-media\"><img src=\"/_blob/79861d98cbdd896f06af65d31421bdb0\" alt=\"The Krate shopfront in Bukit Beruang, Melaka\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%\"><\/div>\n<div style=\"display: flex; flex-direction: column; justify-content: center; padding: clamp(56px, 8vw, 120px) clamp(20px, 6vw, 96px)\">\n<p style=\"margin: 0 0 16px; font-size: 15px; font-weight: 500; color: #1D6A5A\">Krate Caf\u00e9, since 2020<\/p>\n<h2 id=\"cafe-title\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(42px, 5vw, 76px); line-height: 1; letter-spacing: -0.005em; color: #18201E\">Every cup funds the next show.<\/h2>\n<p style=\"margin: 24px 0 0; max-width: 44ch; font-size: 18px; line-height: 1.7; color: #3C4744\">We opened the caf\u00e9 to keep our productions going. Upstairs is the studio where shows are rehearsed and new work begins.<\/p>\n<dl style=\"margin: 32px 0 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 14px 28px; font-size: 17px\">\n<dt style=\"color: #4A5754\">Open<\/dt><dd style=\"margin: 0; color: #18201E\">Wednesday to Sunday, 10am to 6pm<\/dd>\n<dt style=\"color: #4A5754\">Find us<\/dt><dd style=\"margin: 0; color: #18201E\">669 G, Jalan Bukit Beruang 1/1, Bukit Beruang, 75450 Melaka<\/dd>\n<dt style=\"color: #4A5754\">Order<\/dt><dd style=\"margin: 0; color: #18201E\">Dine in, takeaway or Grab. Customisable boxsets for corporate orders and private events.<\/dd>\n<\/dl>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px\">\n<a href=\"https://www.google.com/maps?q=2.24491,102.271632\" style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border-radius: 999px; text-decoration: none; font-weight: 600; background: #1D6A5A; color: #FFFFFF;\">Get directions<\/a>\n<a href=\"https://wa.me/60182235311\" style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border-radius: 999px; text-decoration: none; font-weight: 600; border: 1.5px solid #18201E; color: #18201E; font-weight: 500;\">Ask about boxsets<\/a>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<section id=\"about\" aria-labelledby=\"about-title\" style=\"background: #FFFFFF\">\n<div class=\"wrap split\" style=\"padding-top: clamp(80px, 10vw, 128px); padding-bottom: clamp(80px, 10vw, 128px)\">\n<div>\n<p style=\"margin: 0 0 16px; font-size: 15px; font-weight: 500; color: #1D6A5A\">About Krate<\/p>\n<figure style=\"margin: 0\">\n<blockquote id=\"about-title\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(34px, 3.8vw, 56px); line-height: 1.1; font-weight: 500; color: #18201E\">\u201cWe create immersive theatre that celebrates Malaysian culture.\u201d<\/blockquote>\n<figcaption style=\"margin-top: 18px; font-size: 16px; color: #3C4744\">Wee Shyre May, founder, writer and director<\/figcaption>\n<\/figure>\n<p style=\"margin: 32px 0 0; max-width: 50ch; font-size: 18px; line-height: 1.7; color: #3C4744\">Krate is an independent theatre company and creative community in Melaka. We work closely with venues, including UNESCO heritage houses, to stage site-specific shows that bring history, architecture and culture to life, and we make room for local artists along the way.<\/p>\n<div style=\"margin-top: 32px; padding: 24px 28px; border-radius: 10px; background: #E6F0EB\">\n<h3 style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px; line-height: 1.15; font-weight: 600\">Join a production<\/h3>\n<p style=\"margin: 8px 0 0; color: #3C4744\">We\u2019re always open to actors, crew, artists and volunteers. Follow Instagram for open calls.<\/p>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px\">\n<a href=\"https://wa.me/60182235311\" style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border-radius: 999px; text-decoration: none; font-weight: 600; background: #1D6A5A; color: #FFFFFF;\">Message us on WhatsApp<\/a>\n<a href=\"https://www.instagram.com/krate.my/\" style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border-radius: 999px; text-decoration: none; font-weight: 600; border: 1.5px solid #18201E; color: #18201E; font-weight: 500;\">Follow @krate.my<\/a>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"zoom\" style=\"overflow: hidden; border-radius: 10px; aspect-ratio: 4 / 5\"><img src=\"/_blob/70264a4f035c471f1c43711c9a9d3006\" alt=\"The Krate company in 1930s costume, gathered together after a show\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: 55% 50%\"><\/div>\n<\/div>\n<\/section>\n\n<svg aria-hidden=\"true\" width=\"100%\" height=\"80\" style=\"display: block\">\n<defs>\n<clipPath id=\"ft_c\"><rect width=\"80\" height=\"80\"><\/rect><\/clipPath>\n<pattern id=\"ft_p\" x=\"0\" y=\"0\" width=\"240\"
