morant Garamond', Georgia, serif; font-size: 30px; font-weight: 600; color: #F3E4C4; text-decoration: none\">About<\/a>\n<a href=\"book.html\" onClick=\"{{closeMenu}}\" style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border-radius: 999px; text-decoration: none; font-weight: 600; background: #F2C38B; color: #1A1208; width: 100%; margin-top: 24px\">Book Krate<\/a>\n<\/div>\n<\/nav>\n<\/sc-if>\n<\/header>\n\n<section aria-labelledby=\"show-title\" style=\"background: #0E2B27; color: #F2F5F3\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 40px clamp(20px, 4.5vw, 64px) 96px\">\n<nav aria-label=\"Breadcrumb\" style=\"font-size: 15px; color: #A9BDB7\">\n<a href=\"index.html#productions\" style=\"color: #F2F5F3\">Productions<\/a>\n<span aria-hidden=\"true\" style=\"margin: 0 10px\">/<\/span>\n<span>A Chef\u2019s Confession<\/span>\n<\/nav>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 48px 88px; margin-top: 40px\">\n<div style=\"flex: 0 1 420px; min-width: 0; padding: 12px; border: 1px solid #C9A55A\">\n<img src=\"/_blob/d7fe037edb36617a060da9785d3aeef6\" alt=\"Poster for A Chef\u2019s Confession, showing the cast in 1930s costume around a detective with a magnifying glass\" style=\"width: 100%; aspect-ratio: 700 / 938; object-fit: cover\">\n<\/div>\n<div style=\"flex: 1 1 440px; min-width: 0\">\n<p style=\"margin: 0 0 18px; font-size: 16px; font-weight: 500; color: #C9A55A\">Murder-mystery dinner show, 2026<\/p>\n<h1 id=\"show-title\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(56px, 7vw, 104px); line-height: 0.95; letter-spacing: -0.012em\">A Chef\u2019s Confession<\/h1>\n<p style=\"margin: 28px 0 0; max-width: 40ch; font-size: 20px; line-height: 1.6; color: #D5E0DC\">Step into 1930s Malaya, where Peranakan cuisine is served, secrets simmer beneath silk and silver, and nothing is quite what it seems. This is not just a meal. It\u2019s an investigation.<\/p>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 32px\">\n<p style=\"display: inline-flex; align-items: center; gap: 10px; margin: 0; padding: 8px 18px; border: 1px solid #C9A55A; border-radius: 999px; font-size: 15px\">\n<span aria-hidden=\"true\" style=\"display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #A9BDB7\"><\/span>Both runs have ended<\/p>\n<p style=\"margin: 0; font-size: 16px; color: #A9BDB7\">More than 600 guests joined us<\/p>\n<\/div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px\">\n<a href=\"https://www.instagram.com/krate.my/\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; border-radius: 999px; background: #C9A55A; color: #0E2B27; text-decoration: none; font-weight: 600\">Hear about the next run<\/a>\n<a href=\"book.html\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; border-radius: 999px; border: 1.5px solid #F2F5F3; color: #F2F5F3; text-decoration: none; font-weight: 500\">Host it for your group<\/a>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<section aria-label=\"Show details\" style=\"max-width: 1240px; margin: 0 auto; padding: 96px clamp(20px, 4.5vw, 64px); display: flex; flex-wrap: wrap; gap: 56px 88px\">\n<div style=\"flex: 1.2 1 460px; min-width: 0\">\n<h2 style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(36px, 3.6vw, 52px); line-height: 1.05\">The evening at a glance<\/h2>\n<dl style=\"margin: 32px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 40px\">\n<div style=\"border-top: 1px solid #C9A55A; padding-top: 14px\">\n<dt style=\"font-size: 15px; color: #4A5754\">Format<\/dt>\n<dd style=\"margin: 6px 0 0; font-size: 18px; font-weight: 500\">Walk-through murder-mystery dinner<\/dd>\n<\/div>\n<div style=\"border-top: 1px solid #C9A55A; padding-top: 14px\">\n<dt style=\"font-size: 15px; color: #4A5754\">Setting<\/dt>\n<dd style=\"margin: 6px 0 0; font-size: 18px; font-weight: 500\">1930s Malaya<\/dd>\n<\/div>\n<div style=\"border-top: 1px solid #C9A55A; padding-top: 14px\">\n<dt style=\"font-size: 15px; color: #4A5754\">Included<\/dt>\n<dd style=\"margin: 6px 0 0; font-size: 18px; font-weight: 500\">A shared Peranakan meal<\/dd>\n<\/div>\n<div style=\"border-top: 1px solid #C9A55A; padding-top: 14px\">\n<dt style=\"font-size: 15px; color: #4A5754\">Taking part<\/dt>\n<dd style=\"margin: 6px 0 0; font-size: 18px; font-weight: 500\">Join the role-play, or simply observe<\/dd>\n<\/div>\n<div style=\"border-top: 1px solid #C9A55A; padding-top: 14px\">\n<dt style=\"font-size: 15px; color: #4A5754\">Dress code<\/dt>\n<dd style=\"margin: 6px 0 0; font-size: 18px; font-weight: 500\">Vintage or Peranakan-inspired attire<\/dd>\n<\/div>\n<div style=\"border-top: 1px solid #C9A55A; padding-top: 14px\">\n<dt style=\"font-size: 15px; color: #4A5754\">Group size<\/dt>\n<dd style=\"margin: 6px 0 0; font-size: 18px; font-weight: 500\">Limited guests each night<\/dd>\n<\/div>\n<\/dl>\n<\/div>\n<div style=\"flex: 1 1 380px; min-width: 0\">\n<h2 style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(36px, 3.6vw, 52px); line-height: 1.05\">Where it played<\/h2>\n<div style=\"margin-top: 32px; border-top: 1px solid rgba(14, 43, 39, 0.22)\">\n<div style=\"padding: 20px 0; border-bottom: 1px solid rgba(14, 43, 39, 0.22)\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px\">\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 600\">Garden@Heeren, Melaka<\/h3>\n<span style=\"font-size: 15px; color: #4A5754\">Ended<\/span>\n<\/div>\n<p style=\"margin: 6px 0 0; color: #3C4744\">July to August 2026, through an iconic heritage house<\/p>\n<\/div>\n<div style=\"padding: 20px 0; border-bottom: 1px solid rgba(14, 43, 39, 0.22)\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px\">\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 600\">The Chow Kit, Kuala Lumpur<\/h3>\n<span style=\"font-size: 15px; color: #4A5754\">Ended<\/span>\n<\/div>\n<p style=\"margin: 6px 0 0; color: #3C4744\">5 to 6 September 2026, in collaboration with The Chow Kit, an Ormond Hotel<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<section aria-labelledby=\"steps\" style=\"background: #E6F0EB\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 96px clamp(20px, 4.5vw, 64px)\">\n<h2 id=\"steps\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(40px, 4.6vw, 64px); line-height: 1.02\">How the night unfolds<\/h2>\n<ol style=\"list-style: none; margin: 48px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 40px 36px\">\n<li>\n<p aria-hidden=\"true\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 64px; line-height: 1; font-weight: 600; color: {{accent}}\">1<\/p>\n<h3 style=\"margin: 16px 0 0; font-size: 20px; font-weight: 600\">Dinner is served<\/h3>\n<p style=\"margin: 8px 0 0; color: #3C4744\">The evening opens with a shared Peranakan meal.<\/p>\n<\/li>\n<li>\n<p aria-hidden=\"true\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 64px; line-height: 1; font-weight: 600; color: {{accent}}\">2<\/p>\n<h3 style=\"margin: 16px 0 0; font-size: 20px; font-weight: 600\">The guests split up<\/h3>\n<p style=\"margin: 8px 0 0; color: #3C4744\">You\u2019re divided into smaller groups and move through the house.<\/p>\n<\/li>\n<li>\n<p aria-hidden=\"true\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 64px; line-height: 1; font-weight: 600; color: {{accent}}\">3<\/p>\n<h3 style=\"margin: 16px 0 0; font-size: 20px; font-weight: 600\">Meet the suspects<\/h3>\n<p style=\"margin: 8px 0 0; color: #3C4744\">Encounter the characters, question them and uncover clues.<\/p>\n<\/li>\n<li>\n<p aria-hidden=\"true\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 64px; line-height: 1; font-weight: 600; color: {{accent}}\">4<\/p>\n<h3 style=\"margin: 16px 0 0; font-size: 20px; font-weight: 600\">Crack the case<\/h3>\n<p style=\"margin: 8px 0 0; color: #3C4744\">Work together to solve the mystery before the night ends.<\/p>\n<\/li>\n<\/ol>\n<\/div>\n<\/section>\n\n<section aria-label=\"Photos from the show\" style=\"max-width: 1240px; margin: 0 auto; padding: 96px clamp(20px, 4.5vw, 64px) 48px; display: flex; flex-wrap: wrap; gap: 24px\">\n<figure style=\"flex: 1.6 1 520px; min-width: 0; margin: 0\">\n<img src=\"/_blob/70264a4f035c471f1c43711c9a9d3006\" alt=\"The cast of A Chef\u2019s Confession in 1930s costume, posed together\" style=\"width: 100%; height: 460px; object-fit: cover; border-radius: 4px\">\n<figcaption style=\"margin-top: 12px; font-size: 15px; color: #4A5754\">The cast of A Chef\u2019s Confession<\/figcaption>\n<\/figure>\n<figure style=\"flex: 1 1 320px; min-width: 0; margin: 0\">\n<img src=\"/_blob/b17d4889ac88a42d64518d97e280ece0\" alt=\"A scene plays out between dinner tables while guests watch\" style=\"width: 100%; height: 460px; object-fit: cover; border-radius: 4px\">\n<figcaption style=\"margin-top: 12px; font-size: 15px; color: #4A5754\">A scene unfolds between the dinner tables<\/figcaption>\n<\/figure>\n<\/section>\n\n<section aria-label=\"Guest review\" style=\"max-width: 1240px; margin: 0 auto; padding: 48px clamp(20px, 4.5vw, 64px) 104px; display: flex; flex-wrap: wrap; align-items: center; gap: 48px 80px\">\n<figure style=\"flex: 1 1 460px; min-width: 0; margin: 0\">\n<img src=\"/_blob/17286bfa04bba1c2ef6f249149ad2b47\" alt=\"Illustrated portraits of the show\u2019s characters in 1930s dress\" style=\"width: 100%; border-radius: 4px\">\n<figcaption style=\"margin-top: 12px; font-siz
