ookTop)\"><\/rect>\n<\/svg>\n\n<section aria-labelledby=\"services\" style=\"max-width: 1240px; margin: 0 auto; padding: 96px clamp(20px, 4.5vw, 64px)\">\n<h2 id=\"services\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(44px, 5vw, 72px); line-height: 1\">What you can book<\/h2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 56px 40px; margin-top: 56px\">\n<article>\n<img src=\"/_blob/3157446a5c80afc7f1510c053f39e43a\" alt=\"Performers on a lit stage in front of an event audience\" style=\"width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px\">\n<h3 style=\"margin: 24px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 34px; line-height: 1.1; font-weight: 600\">Private and corporate shows<\/h3>\n<p style=\"margin: 10px 0 0; max-width: 46ch; color: #3C4744\">An immersive heritage experience, a full-scale musical, a black box piece or a site-specific show designed for your space.<\/p>\n<\/article>\n<article>\n<img src=\"/_blob/8e2f963f66a4c3de30bb38891a2cd017\" alt=\"A performance under coloured stage lights in the Krate event space\" style=\"width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px\">\n<h3 style=\"margin: 24px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 34px; line-height: 1.1; font-weight: 600\">Event space<\/h3>\n<p style=\"margin: 10px 0 0; max-width: 46ch; color: #3C4744\">Hire our space in Bukit Beruang, Melaka, for performances, gatherings and private celebrations, with boxsets and catering from Krate Caf\u00e9.<\/p>\n<\/article>\n<article>\n<img src=\"/_blob/35a4461ccade34ef47e2e8d914f8323f\" alt=\"Workshop participants holding up their finished artworks\" style=\"width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px\">\n<h3 style=\"margin: 24px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 34px; line-height: 1.1; font-weight: 600\">Art workshops and education<\/h3>\n<p style=\"margin: 10px 0 0; max-width: 46ch; color: #3C4744\">Hands-on art sessions and educational showcases for schools, teams and community groups.<\/p>\n<\/article>\n<article>\n<img src=\"/_blob/12e8c645ffeefa6f30979c2f9d8d4b6b\" alt=\"An artist painting a mural of a traditional house on a wall\" style=\"width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px\">\n<h3 style=\"margin: 24px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 34px; line-height: 1.1; font-weight: 600\">Art murals<\/h3>\n<p style=\"margin: 10px 0 0; max-width: 46ch; color: #3C4744\">Hand-painted murals for homes, caf\u00e9s and businesses, by the artists in our community.<\/p>\n<\/article>\n<\/div>\n<\/section>\n\n<section aria-label=\"Why organisers book Krate\" style=\"background: #0E2B27; color: #F2F5F3\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 96px clamp(20px, 4.5vw, 64px); display: flex; flex-wrap: wrap; gap: 56px 88px\">\n<figure style=\"flex: 1.3 1 480px; min-width: 0; margin: 0\">\n<blockquote style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(30px, 3.4vw, 46px); line-height: 1.18; font-weight: 500\">\u201cImmersive theater has hit all the core points of what a curator would consider successful original content, with strong possibilities of being engaged for other shows.\u201d<\/blockquote>\n<figcaption style=\"margin-top: 22px; font-size: 16px; color: #A9BDB7\">Alexdrina, main organiser of Riuh Nau, Melaka<\/figcaption>\n<\/figure>\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 28px\">\n<div style=\"border-top: 1px solid #C9A55A; padding-top: 16px\">\n<p style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 44px; line-height: 1; font-weight: 600\">10+<\/p>\n<p style=\"margin: 8px 0 0; color: #A9BDB7\">Original productions since 2016<\/p>\n<\/div>\n<div style=\"border-top: 1px solid #C9A55A; padding-top: 16px\">\n<p style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 44px; line-height: 1; font-weight: 600\">3 cities<\/p>\n<p style=\"margin: 8px 0 0; color: #A9BDB7\">Melaka, Kuala Lumpur and Penang<\/p>\n<\/div>\n<div style=\"border-top: 1px solid #C9A55A; padding-top: 16px\">\n<p style=\"margin: 0; font-size: 18px; line-height: 1.5\">Infineon, MAE by Maybank, OCBC Bank, The Chow Kit, TEDxJonkerStreet<\/p>\n<p style=\"margin: 8px 0 0; color: #A9BDB7\">Among the brands and partners we\u2019ve worked with<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<section id=\"enquire\" aria-labelledby=\"enquire-title\" style=\"background: #FFFFFF\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: clamp(80px, 9vw, 112px) clamp(20px, 4.5vw, 64px); display: flex; flex-wrap: wrap; align-items: center; gap: 48px 88px\">\n<div style=\"flex: 1 1 360px; min-width: 0\">\n<p style=\"margin: 0 0 14px; font-size: 15px; font-weight: 500; color: #1D6A5A\">Enquiries<\/p>\n<h2 id=\"enquire-title\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(44px, 5vw, 68px); line-height: 1; color: #18201E\">Tell us about your event<\/h2>\n<p style=\"margin: 22px 0 0; max-width: 40ch; font-size: 18px; line-height: 1.7; color: #3C4744\">The quickest way to reach the Krate team is WhatsApp. Pick what you\u2019re planning and your message will be ready to send; just add your date, guest numbers and venue.<\/p>\n<p style=\"margin: 22px 0 0; font-size: 16px; color: #4A5754\">Prefer email? <a href=\"mailto:kratedotmy@gmail.com\" style=\"color: #1D6A5A\">kratedotmy@gmail.com<\/a><\/p>\n<\/div>\n<div style=\"flex: 1.2 1 460px; min-width: 0; padding: clamp(28px, 4vw, 44px); border-radius: 16px; background: #0E2B27; color: #F2F5F3\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 500; color: #C9A55A\">What are you planning?<\/p>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, m an%20enquiry.\" target=\"_blank\" rel=\"noopener\" style=\"display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 58px; margin-top: 20px; border-radius: 999px; background: #C9A55A; color: #0E2B27; text-decoration: none; font-weight: 600; font-size: 17px\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.6-5.2A8.5 8.5 0 1 1 21 11.5z\"><\/path><path d=\"M9 9.5c.3 1.8 1.7 3.6 3.6 4.4l1.2-1.1 1.9.8-.4 1.6c-3.5.2-7-3.2-6.8-6.8l1.6-.4.8 1.9z\"><\/path><\/svg>Send enquiry via WhatsApp<\/a>\n<p style=\"margin: 14px 0 0; text-align: center; font-size: 14px; color: #A9BDB7\">Opens WhatsApp with a message ready to send to +60 18-223 5311<\/p>\n<\/div>\n<\/div>\n<\/section>\n\n<section aria-labelledby=\"faq\" style=\"background: #E6F0EB\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 96px clamp(20px, 4.5vw, 64px); display: flex; flex-wrap: wrap; gap: 40px 88px\">\n<h2 id=\"faq\" style=\"flex: 1 1 280px; min-width: 0; margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(40px, 4.4vw, 60px); line-height: 1.02\">Questions organisers ask<\/h2>\n<div style=\"flex: 2 1 520px; min-width: 0; border-top: 1px solid rgba(14, 43, 39, 0.22)\">\n<details style=\"border-bottom: 1px solid rgba(14, 43, 39, 0.22)\">\n<summary style=\"display: flex; align-items: center; min-height: 64px; cursor: pointer; font-size: 19px; font-weight: 500\">Can you perform at our venue?<\/summary>\n<p style=\"margin: 0 0 22px; max-width: 60ch; color: #3C4744\">Yes. Many of our shows are site-specific, designed around the space they\u2019re staged in, from heritage houses to restaurants and hotels.<\/p>\n<\/details>\n<details style=\"border-bottom: 1px solid rgba(14, 43, 39, 0.22)\">\n<summary style=\"display: flex; align-items: center
