<html lang="en">
<head>
<meta charset="utf-8">

<title>Tears Under the Rising Sun — Krate</title>

<style>
body{margin:0;background:#0A1222}
html{scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
a{color:#E9C77F}a:hover{color:#FFF6E6}
a:focus-visible,button:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid #E9C77F;outline-offset:3px}
img{display:block;max-width:100%}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{max-width:1280px;margin-left:auto;margin-right:auto;padding-left:clamp(20px,5vw,72px);padding-right:clamp(20px,5vw,72px)}
.nav-links{display:flex}
.nav-toggle{display:none}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-30%)}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.drift{animation:drift 70s ease-in-out infinite alternate}
.rise{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}
.rise-3{animation-delay:.45s}
@media (max-width:860px){.nav-links{display:none}.nav-toggle{display:inline-flex}}
@media (max-width:900px){.seatmap{zoom:.8}}
@media (max-width:700px){.seatmap{zoom:.6}}
@media (max-width:480px){.seatmap{zoom:.42}}
@media (max-width:600px){.pin-badge{width:40px!important;height:40px!important}.pin-label{font-size:11px!important;padding:2px 8px!important}.bar-extra{display:none}}
.spotgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.bonusgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.spotcard{height:300px}
.bonus-title{grid-column:span 2}
@media (max-width:1000px){.bonus-title{height:auto!important;padding-bottom:8px!important}}
.crewgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(20px,3vw,36px) clamp(14px,2vw,28px)}
.crewlists{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 56px}
@media (max-width:860px){.crewlists{grid-template-columns:1fr}}
@media (max-width:560px){.crewgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.castgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(20px,3vw,36px) clamp(14px,2vw,28px)}
@media (max-width:560px){.castgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.facts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:rgba(201,165,90,.22)}
.credits{column-count:3;column-gap:56px}
.credit{break-inside:avoid}
.credit-head{break-after:avoid}
[data-track]{scrollbar-width:none}
[data-track]::-webkit-scrollbar{display:none}
@media (max-width:1100px){.facts{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1000px){.credits{column-count:2}}
@media (max-width:620px){.credits{column-count:1}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.flip{transition:transform .75s cubic-bezier(.2,.7,.2,1)}
.spot-front{transition:border-color .3s ease}
.spotcard:hover .spot-front{border-color:rgba(242,195,139,.9)}
@media (max-width:1000px){.spotgrid,.bonusgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.spotcard{height:290px}}
@media (max-width:600px){.spotcard{height:350px}}
@media (prefers-reduced-motion:reduce){.drift,.rise{animation:none}.flip{transition:none}}
.sr{display:flex;align-items:center;justify-content:center;gap:0 22px;min-height:24px}
.bl{display:flex;gap:4px}
.rl{width:22px;text-align:center;font-size:11px;font-weight:600;color:#9AA6BC}
.st{display:inline-flex;align-items:center;justify-content:center;flex:none;width:20px;height:20px;border-radius:4px;font-size:9px;font-weight:600;line-height:1;transition:background-color .2s,color .2s}
.s-vip{background:#E9C77F;color:#0A1222}
.s-std{background:#E07A5F;color:#0A1222}
.s-stu{background:#8FC1D4;color:#0A1222}
.s-dim{background:rgba(201,209,223,.12);color:rgba(201,209,223,.5)}
</style>

-width: 520px; opacity: 0.32; pointer-events: none\">\n<img src=\"/_blob/a0a3634d19131cbefe41669e9dfc34c6\" alt=\"\" aria-hidden=\"true\" style=\"position: absolute; right: 0; bottom: 0; width: 36%; max-width: 520px; opacity: 0.32; transform: scaleX(-1); pointer-events: none\">\n<div style=\"position: relative; padding: 112px 20px 150px\">\n<p style=\"margin: 0; font-size: 16px; font-weight: 500; color: #E9C77F\">December 1941 to February 1942<\/p>\n<h2 id=\"y1942\" style=\"margin: 12px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; font-size: clamp(150px, 22vw, 320px); line-height: 0.82; letter-spacing: 0.02em; color: #F3E4C4; text-shadow: 0 0 60px rgba(206, 166, 124, 0.35)\">1942<\/h2>\n<p style=\"margin: 26px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(30px, 3.2vw, 46px); font-weight: 600\">Malaya falls.<\/p>\n<p style=\"max-width: 54ch; margin: 14px auto 0; font-size: 18px; color: #D9DFEA\">Japanese forces land in December 1941. Within ten weeks the peninsula and Singapore are under occupation, and life in Melaka changes for three years and eight months.<\/p>\n<\/div>\n<\/section>\n\n<!-- 4. Synopsis -->\n<section id=\"synopsis\" aria-labelledby=\"synopsis-title\" style=\"background: #0A1222\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 104px clamp(20px, 4.5vw, 64px); display: flex; flex-wrap: wrap; align-items: center; gap: 56px 80px\">\n<div style=\"flex: 1 1 440px; min-width: 0\">\n<p style=\"margin: 0 0 14px; font-size: 15px; font-weight: 500; color: #F2A66E\">Synopsis<\/p>\n<h2 id=\"synopsis-title\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(40px, 4.8vw, 68px); line-height: 1.02; color: #F3E4C4\">1944. A survival routine.<\/h2>\n<p style=\"margin: 28px 0 0; font-size: 19px; line-height: 1.7; color: #D9DFEA\">Two years have passed since the fall of Malaya. The initial shock of invasion has settled into a quiet, grinding regime of curfews, food shortages, military surveillance and constant fear.<\/p>\n<p style=\"margin: 18px 0 0; font-size: 19px; line-height: 1.7; color: #D9DFEA\">Inside a quiet Peranakan family home, Suzzane Soon and her housekeeper Neo Lan keep up their daily rituals to survive, until a wounded fugitive, Tom Takayashima Richards, crosses their threshold and changes their lives forever.<\/p>\n<p style=\"margin: 18px 0 0; font-size: 19px; line-height: 1.7; color: #D9DFEA\">Told through original songs, traditional instrumentation and authentic Peranakan culture, it is a story of love, sacrifice, survival and the choices we make in times of war.<\/p>\n<p style=\"margin: 28px 0 0; padding: 14px 18px; border-left: 3px solid #C8432B; background: rgba(200, 67, 43, 0.1); font-size: 16px; color: #F3E4C4\">A work of fiction inspired by true events. Set in wartime, the production contains dark and mature themes.<\/p>\n<\/div>\n<figure style=\"flex: 0.75 1 360px; min-width: 0; max-width: 470px; margin: 0; padding: 12px; border: 1px solid #C9A55A\">\n<img src=\"/_blob/0cc4022e304356539993ef8966308812\" alt=\"Poster for Tears Under the Rising Sun: Tom holds Suzzane close under a smoky sky as warplanes pass overhead\" style=\"width: 100%; aspect-ratio: 3 / 4; object-fit: cover\">\n<\/figure>\n<\/div>\n<\/section>\n\n<!-- 5. Japanese Occupation timeline -->\n<section id=\"timeline\" aria-labelledby=\"timeline-title\" style=\"background: #0E1830\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 104px clamp(20px, 4.5vw, 64px)\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px 48px\">\n<div style=\"flex: 1 1 520px; min-width: 0\">\n<p style=\"margin: 0 0 14px; font-size: 15px; font-weight: 500; color: #F2A66E\">The history behind the story<\/p>\n<h2 id=\"timeline-title\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(40px, 4.8vw, 68px); line-height: 1.02; color: #F3E4C4\">The Japanese Occupation<\/h2>\n<\/div>\n<div style=\"flex: 0 1 300px; border-top: 1px solid #C9A55A; padding-top: 14px\">\n<p style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 48px; line-height: 1; font-weight: 600; color: #F3E4C4\">3 years, 8 months<\/p>\n<p style=\"margin: 8px 0 0; font-size: 15px; color: #9AA6BC\">How long Malaya lived under Japanese rule<\/p>\n<\/div>\n<\/div>\n<ol style=\"list-style: none; margin: 56px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 48px 0\">\n<sc-for list=\"{{timeline}}\" as=\"ev\" hint-placeholder-count=\"8\">\n<li style=\"padding-right: 28px\">\n<div aria-hidden=\"true\" style=\"display: flex; align-items: center; height: 24px\">\n<span style=\"flex: none; width: 14px; height: 14px; transform: rotate(45deg); {{ev.marker}}\"><\/span>\n<span style=\"flex: 1; height: 1px; margin-left: 10px; background: rgba(201, 165, 90, 0.45)\"><\/span>\n<\/div>\n<p style=\"margin: 16px 0 0; font-size: 15px; font-weight: 500; {{ev.dateColor}}\">{{ev.date}}<\/p>\n<h3 style=\"margin: 6px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 28px; line-height: 1.1; font-weight: 600; color: #F3E4C4\">{{ev.title}}<\/h3>\n<p style=\"margin: 10px 0 0; font-size: 16px; line-height: 1.6\">{{ev.text}}<\/p>\n<sc-if value=\"{{ev.story}}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"display: inline-block; margin: 14px 0 0; padding: 4px 12px; border-radius: 999px; background: rgba(200, 67, 43, 0.2); color: #F2A08E; font-size: 13px; font-weight: 500\">In the story<\/p>\n<\/sc-if>\n<\/li>\n<\/sc-for>\n<\/ol>\n<\/div>\n<\/section>\n\n<!-- 6. Map of Melaka -->\n<section id=\"map\" aria-labelledby=\"map-title\" style=\"background: #0A1222\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 104px clamp(20px, 4.5vw, 64px)\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px 48px\">\n<div style=\"flex: 1 1 480px; min-width: 0\">\n<p style=\"margin: 0 0 14px; font-size: 15px; font-weight: 500; color: #F2A66E\">Melaka, then and now<\/p>\n<h2 id=\"map-title\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(40px, 4.8vw, 68px); line-height: 1.02; color: #F3E4C4\">Find your way around<\/h2>\n<\/div>\n<div role=\"group\" aria-label=\"Map view\" style=\"display: inline-flex; padding: 4px; border-radius: 999px; border: 1px solid rgba(201, 165, 90, 0.5)\">\n<button type=\"button\" onClick=\"{{showStory}}\" aria-pressed=\"{{storyPressed}}\" style=\"min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; font: inherit; font-weight: 500; cursor: pointer; {{storyBtn}}\">In the story<\/button>\n<button type=\"button\" onClick=\"{{showVisit}}\" aria-pressed=\"{{visitPressed}}\" style=\"min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; font: inherit; font-weight: 500; cursor: pointer; {{visitBtn}}\">On show night<\/button>\n<\/div>\n<\/div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px 48px; margin-top: 48px; align-items: center\">\n<div style=\"flex: 2.4 1 620px; min-width: 0\">\n<div style=\"position: relative; width: 100%\">\n<img src=\"/_blob/c906533c32ac0cc4f878079a5239da5f\" alt=\"Illustrated map of Melaka state with clouds drifting over it\" style=\"width: 100%\">\n<img aria-hidden=\"true\" src=\"/_blob/17e70cfb82760b3e06f0fd189b8989a0\" alt=\"\" style=\"position: absolute; left: 18%; top: 44%; width: clamp(18px, 2.6vw, 36px); transform: translate(-50%, -50%); pointer-events: none; opacity: 0.95\"><img aria-hidden=\"true\" src=\"/_blob/17e70cfb82760b3e06f0fd189b8989a0\" alt=\"\" style=\"position: absolute; left: 30%; top: 30%; width: clamp(18px, 2.2vw, 30px); transform: translate(-50%, -50%); pointer-events: none; opacity: 0.95\"><img aria-hidden=\"true\" src=\"/_blob/17e70cfb82760b3e06f0fd189b8989a0\" alt=\"\" style=\"position: absolute; left: 37%; top: 27%; wi }}\">\n<img src=\"{{p.img}}\" alt=\"\" style=\"height: clamp(32px, 6vw, 84px); width: auto; max-width: none; transition: transform 0.3s ease, filter 0.3s ease; {{p.glow}}\">\n<span style=\"display: inline-block; margin-top: -8px; padding: 6px 14px 5px; background: url(/_blob/b0fc8815ea1c571b00067d60c871ff3c) center / 100% 100% no-repeat; color: #2A241B; font-family: 'Special Elite', 'Courier New', monospace; font-size: clamp(9px, 1vw, 12.5px); line-height: 1.15; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; transform: rotate({{p.tilt}}deg); transition: box-shadow 0.3s ease; {{p.tapeRing}}\">{{p.name}}<\/span>\n<\/sc-if>\n<sc-if value=\"{{p.isNum}}\" hint-placeholder-val=\"{{ false }}\">\n<span class=\"pin-badge\" style=\"display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 50%; background: #F2C38B; color: #1A1208; font-weight: 600; font-size: 18px; {{p.ring}}\">{{p.num}}<\/span>\n<span class=\"pin-label\" style=\"padding: 4px 12px; border-radius: 999px; background: rgba(7, 13, 25, 0.88); font-size: 13px; font-weight: 500; white-space: nowrap\">{{p.name}}<\/span>\n<\/sc-if>\n<\/button>\n<\/sc-for>\n<\/div>\n<p style=\"margin: 12px 0 0; font-size: 14px; color: #9AA6BC\">Illustrative map, not to scale. Tap a place to read more.<\/p>\n<\/div>\n<div aria-live=\"polite\" style=\"flex: 1 1 320px; min-width: 0; padding: 32px; border-radius: 8px; background: #111C33; border: 1px solid rgba(201, 165, 90, 0.4)\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 500; color: #C9A55A\">{{pinKicker}}<\/p>\n<h3 style=\"margin: 8px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 34px; line-height: 1.1; font-weight: 600; color: #F3E4C4\">{{pinName}}<\/h3>\n<p style=\"margin: 14px 0 0; font-size: 17px; line-height: 1.65\">{{pinText}}<\/p>\n<sc-if value=\"{{pinHasLink}}\" hint-placeholder-val=\"{{ false }}\">\n<a href=\"{{pinLink}}\" style=\"display: inline-flex; align-items: center; min- ont-weight: 600; font-size: clamp(40px, 4.8vw, 68px); line-height: 1.02\">Melaka\u2019s first independent creative community<\/h2>\n<p style=\"margin: 24px 0 0; font-size: 18px; line-height: 1.7; color: #D5E0DC\">Established in 2016, Krate specialises in customised interactive and multi-disciplinary performances. From intimate black box productions to site-specific walk-through theatre and full-scale original musicals, our work blends theatre, music and movement with local narratives.<\/p>\n<a href=\"https://www.krate.com.my/\" style=\"display: inline-flex; align-items: center; min-height: 52px; margin-top: 32px; padding: 0 28px; border-radius: 999px; background: #C9A55A; color: #0E2B27; text-decoration: none; font-weight: 600\">Visit krate.com.my<\/a>\n<\/div>\n<div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n<div style=\"border-top: 1px solid #C9A55A; padding-top: 14px\"><p style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 48px; line-height: 1; font-weight: 600\">10+<\/p><p style=\"margin: 6px 0 0; color: #A9BDB7\">Original productions since 2016<\/p><\/div>\n<div style=\"border-top: 1px solid #C9A55A; padding-top: 14px\"><p style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 48px; line-height: 1; font-weight: 600\">18 shows<\/p><p style=\"margin: 6px 0 0; color: #A9BDB7\">The Great Gossip\u2019s record sell-out run, in under two weeks<\/p><\/div>\n<div style=\"border-top: 1px solid #C9A55A; padding-top: 14px\"><p style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 48px; line-height: 1; font-weight: 600\">3 cities<\/p><p style=\"margin: 6px 0 0; color: #A9BDB7\">Melaka, Kuala Lumpur and Penang<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- 14. Partnerships and collaborations -->\n<section aria-labelledby=\"partners-title\" style=\"background: #0A1222\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 88px clamp(20px
