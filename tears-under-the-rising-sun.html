<script>
(function(){
function setTab(c,i){var ts=c.querySelectorAll('.pcard-tab'),ps=c.querySelectorAll('.pcard-panel');for(var j=0;j<ts.length;j++){ts[j].classList.toggle('on',j===i);}for(var k=0;k<ps.length;k++){ps[k].classList.toggle('on',k===i);}}
function toggle(c){var on=c.classList.toggle('is-open');c.setAttribute('aria-pressed',on?'true':'false');if(on){setTab(c,0);var bk=c.querySelector('.pcard-back');if(bk)fitOne(bk);}}
document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('.pcard-tab');if(t){var cc=t.closest('.pcard');setTab(cc,parseInt(t.getAttribute('data-p'),10));return;}var c=e.target.closest&&e.target.closest('.pcard');if(c)toggle(c);});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('pcard')){e.preventDefault();toggle(e.target);}});
function fitOne(k){var b=k.querySelector('.pcard-panels')||k.querySelector('.pcard-bio');if(!b)return;b.style.fontSize='';b.style.lineHeight='';var fs=parseFloat(getComputedStyle(b).fontSize);while(k.scrollHeight>k.clientHeight+1&&fs>9.5){fs-=.5;b.style.fontSize=fs+'px';if(fs<12.5)b.style.lineHeight='1.38';}}
function fit(){var bs=document.querySelectorAll('.pcard-back');for(var i=0;i<bs.length;i++)fitOne(bs[i]);}
var ft;function fitSoon(){clearTimeout(ft);ft=setTimeout(fit,120);}
window.addEventListener('resize',fitSoon);window.addEventListener('load',fit);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);[300,900,2000,4000].forEach(function(d){setTimeout(fit,d);});
function sync(){var g=document.querySelector('.castgrid'),t=document.querySelector('.cast-track i');if(!g||!t)return;var m=g.scrollWidth-g.clientWidth;if(m<=0){t.style.width='100%';t.style.left='0';return;}var w=g.clientWidth/g.scrollWidth*100;t.style.width=w+'%';t.style.left=(g.scrollLeft/m*(100-w))+'%';}
document.addEventListener('scroll',sync,true);window.addEventListener('resize',sync);window.addEventListener('load',sync);[300,900,2000].forEach(function(d){setTimeout(sync,d);});
})();

v>\n<\/sc-if>\n<sc-if value=\"{{isPast}}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 32px 0 0; padding: 16px 20px; border-radius: 8px; border: 1px solid rgba(201, 165, 90, 0.45); color: #F3E4C4\">Ticket sales for this run have closed.<\/p>\n<\/sc-if>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- 3. 1942 banner -->\n<section aria-labelledby=\"y1942\" class=\"y1942\">\n<div class=\"y1942-bg\" aria-hidden=\"true\"><\/div>\n<div class=\"y1942-in\">\n<p class=\"y1942-date\">December 1941 - February 1942<\/p>\n<h2 id=\"y1942\" class=\"y1942-year\">1942<\/h2>\n<p class=\"y1942-lead\">Malaya falls.<\/p>\n<p class=\"y1942-body\">Japanese forces land in December 1941. Within ten weeks the peninsula and Singapore are under occupation, and life in Melaka changes for three years and eight months.<\/p>\n<\/div>\n<\/section>\n<!-- 4. Synopsis -->\n<section id=\"synopsis\" aria-labelledby=\"synopsis-title\" style=\"background: #0A1222\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 104px clamp(20px, 4.5vw, 64px); display: flex; flex-wrap: wrap; align-items: center; gap: 56px 80px\">\n<div style=\"flex: 1 1 440px; min-width: 0\">\n<p style=\"margin: 0 0 14px; font-size: 15px; font-weight: 500; color: #F2A66E\">Synopsis<\/p>\n<h2 id=\"synopsis-title\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(40px, 4.8vw, 68px); line-height: 1.02; color: #F3E4C4\">1944. A survival routine.<\/h2>\n<p style=\"margin: 28px 0 0; font-size: 19px; line-height: 1.7; color: #D9DFEA\">Two years have passed since the fall of Malaya. The initial shock of invasion has settled into a quiet, grinding regime of curfews, food shortages, military surveillance and constant fear.<\/p>\n<p style=\"margin: 18px 0 0; font-size: 19px; line-height: 1.7; color: #D9DFEA\">Inside a quiet Peranakan family home, Suzzane Soon and her housekeeper Neo Lan keep up their daily rituals to survive, until a wounded fugitive, Tom Takamura Richards, crosses their threshold and changes their lives forever.<\/p>\n<p style=\"margin: 18px 0 0; font-size: 19px; line-height: 1.7; color: #D9DFEA\">Told through original songs, traditional instrumentation and authentic Peranakan culture, it is a story of love, sacrifice, survival and the choices we make in times of war.<\/p>\n<p style=\"margin: 28px 0 0; padding: 14px 18px; border-left: 3px solid #C8432B; background: rgba(200, 67, 43, 0.1); font-size: 16px; color: #F3E4C4\">A work of fiction inspired by true events. Set in wartime, the production contains dark and mature themes.<\/p>\n<\/div>\n<figure style=\"flex: 0.75 1 360px; min-width: 0; max-width: 470px; margin: 0; padding: 12px; border: 1px solid #C9A55A\">\n<img src=\"/_blob/0cc4022e304356539993ef8966308812\" alt=\"Poster for Tears Under the Rising Sun: Tom holds Suzzane close under a smoky sky as warplanes pass overhead\" style=\"width: 100%; aspect-ratio: 3 / 4; object-fit: cover\">\n<\/figure>\n<\/div>\n<\/section>\n\n<!-- 5. Japanese Occupation timeline -->\n<section id=\"timeline\" aria-labelledby=\"timeline-title\" style=\"background: #0E1830\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 104px clamp(20px, 4.5vw, 64px)\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px 48px\">\n<div style=\"flex: 1 1 520px; min-width: 0\">\n<p style=\"margin: 0 0 14px; font-size: 15px; font-weight: 500; color: #F2A66E\">The history behind the story<\/p>\n<h2 id=\"timeline-title\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(40px, 4.8vw, 68px); line-height: 1.02; color: #F3E4C4\">The Japanese Occupation<\/h2>\n<\/div>\n<div style=\"flex: 0 1 300px; border-top: 1px solid #C9A55A; padding-top: 14px\">\n<p style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 48px; line-height: 1; font-weight: 600; color: #F3E4C4\">3 years, 8 months<\/p>\n<p style=\"margin: 8px 0 0; font-size: 15px; color: #9AA6BC\">How long Malaya lived under Japanese rule<\/p>\n<\/div>\n<\/div>\n<ol style=\"list-style: none; margin: 56px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 48px 0\">\n<sc-for list=\"{{timeline}}\" as=\"ev\" hint-placeholder-count=\"8\">\n<li style=\"padding-right: 28px\">\n<div aria-hidden=\"true\" style=\"display: flex; align-items: center; height: 24px\">\n<span style=\"flex: none; width: 14px; height: 14px; transform: rotate(45deg); {{ev.marker}}\"><\/span>\n<span style=\"flex: 1; height: 1px; margin-left: 10px; background: rgba(201, 165, 90, 0.45)\"><\/span>\n<\/div>\n<p style=\"margin: 16px 0 0; font-size: 15px; font-weight: 500; {{ev.dateColor}}\">{{ev.date}}<\/p>\n<h3 style=\"margin: 6px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 28px; line-height: 1.1; font-weight: 600; color: #F3E4C4\">{{ev.title}}<\/h3>\n<p style=\"margin: 10px 0 0; font-size: 16px; line-height: 1.6\">{{ev.text}}<\/p>\n<sc-if value=\"{{ev.story}}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"display: inline-block; margin: 14px 0 0; padding: 4px 12px; border-radius: 999px; background: rgba(200, 67, 43, 0.2); color: #F2A08E; font-size: 13px; font-weight: 500\">In the story<\/p>\n<\/sc-if>\n<\/li>\n<\/sc-for>\n<\/ol>\n<\/div>\n<\/section>\n\n<!-- 6. Map of Melaka -->\n<section id=\"map\" aria-labelledby=\"map-title\" style=\"background: #0A1222\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 104px clamp(20px, 4.5vw, 64px)\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px 48px\">\n<div style=\"flex: 1 1 480px; min-width: 0\">\n<p style=\"margin: 0 0 14px; font-size: 15px; font-weight: 500; color: #F2A66E\">Melaka, then and now<\/p>\n<h2 id=\"map-title\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(40px, 4.8vw, 68px); line-height: 1.02; color: #F3E4C4\">Find your way around<\/h2>\n<\/div>\n<div role=\"group\" aria-label=\"Map view\" style=\"display: inline-flex; padding: 4px; border-radius: 999px; border: 1px solid rgba(201, 165, 90, 0.5)\">\n<button type=\"button\" onClick=\"{{showStory}}\" aria-pressed=\"{{storyPressed}}\" style=\"min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; font: inherit; font-weight: 500; cursor: pointer; {{storyBtn}}\">In the story<\/button>\n<button type=\"button\" onClick=\"{{showVisit}}\" aria-pressed=\"{{visitPressed}}\" style=\"min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; font: inherit; font-weight: 500; cursor: pointer; {{visitBtn}}\">On show night<\/button>\n<\/div>\n<\/div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px 48px; margin-top: 48px; align-items: center\">\n<div style=\"flex: 2.4 1 620px; min-width: 0\">\n<div style=\"position: relative; width: 100%\">\n<img src=\"/_blob/c906533c32ac0cc4f878079a5239da5f\" alt=\"Illustrated map of Melaka state with clouds drifting over it\" style=\"width: 100%\">\n<img aria-hidden=\"true\" src=\"/_blob/17e70cfb82760b3e06f0fd189b8989a0\" alt=\"\" style=\"position: absolute; left: 18%; top: 44%; width: clamp(18px, 2.6vw, 36px); transform: translate(-50%, -50%); pointer-events: none; opacity: 0.95\"><img aria-hidden=\"true\" src=\"/_blob/17e70cfb82760b3e06f0fd189b8989a0\" alt=\"\" style=\"position: absolute; left: 30%; top: 30%; width: clamp(18px, 2.2vw, 30px); transform: translate(-50%, -50%); pointer-events: none; opacity: 0.95\"><img aria-hidden=\"true\" src=\"/_blob/17e70cfb82760b3e06f0fd189b8989a0\" alt=\"\" style=\"position: absolute; left: 37%; top: 27%; width: clamp(18px, 2.8vw, 38px); transform: translate(-50%, -50%); pointer-events: none; opacity: 0.95\"><img aria-hidden=\"true\" src=\"/_blob/17e70cfb82760b3e06f0fd189b8989a0\" alt=\"\" style=\"position: absolute; left: 66%; top: 30%; width: clamp(18px, 2.6vw, 36px); transform: translate(-50%, -50%); pointer-events: none; opacity: 0.95\"><img aria-hidden=\"true\" src=\"/_blob/17e70cfb82760b3e06f0fd189b8989a0\" alt=\"\" style=\"position: absolute; left: 75%; top: 40%; width: clamp(18px, 2.2vw, 30px); transform: translate(-50%, -50%); pointer-events: none; opacity: 0.95\"><img aria-hidden=\"true\" src=\"/_blob/17e70cfb82760b3e06f0fd189b8989a0\" alt=\"\" style=\"position: absolute; left: 80%; top: 56%; width: clamp(18px, 2.8vw, 38px); transform: translate(-50%, -50%); pointer-events: none; opacity: 0.95\"><img aria-hidden=\"true\" src=\"/_blob/17e70cfb82760b3e06f0fd189b8989a0\" alt=\"\" style=\"position: absolute; left: 46%; top: 73%; width: clamp(18px, 2.4vw, 32px); transform: translate(-50%, -50%); pointer-events: none; opacity: 0.95\"><img aria-hidden=\"true\" src=\"/_blob/17e70cfb82760b3e06f0fd189b8989a0\" alt=\"\" style=\"position: absolute; left: 88%; top: 49%; width: clamp(18px, 2vw, 28px); transform: translate(-50%, -50%); pointer-events: none; opacity: 0.95\">\n<p aria-hidden=\"true\" style=\"position: absolute; left: 3%; top: 0; margin: 0; font-family: 'Special Elite', 'Courier New', monospace; font-size: clamp(14px, 2vw, 26px); letter-spacing: 0.14em; color: #F3E4C4\">MELAKA<\/p>\n<sc-for list=\"{{pins}}\" as=\"p\" hint-placeholder-count=\"3\">\n<button type=\"button\" onClick=\"{{p.pick}}\" aria-pressed=\"{{p.pressed}}\" aria-label=\"{{p.name}}\" style=\"position: absolute; left: {{p.x}}%; top: {{p.y}}%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: 0; background: none; color: #F3E4C4; font: inherit; cursor: pointer\">\n<sc-if value=\"{{p.isBldg}}\" hint-placeholder-val=\"{{ true }}\">\n<img src=\"{{p.img}}\" alt=\"\" style=\"height: clamp(32px, 6vw, 84px); width: auto; max-width: none; transition: transform 0.3s ease, filter 0.3s ease; {{p.glow}}\">\n<span style=\"display: inline-block; margin-top: -8px; padding: 6px 14px 5px; background: url(/_blob/b0fc8815ea1c571b00067d60c871ff3c) center / 100% 100% no-repeat; color: #2A241B; font-family: 'Special Elite', 'Courier New', monospace; font-size: clamp(9px, 1vw, 12.5px); line-height: 1.15; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; transform: rotate({{p.tilt}}deg); transition: box-shadow 0.3s ease; {{p.tapeRing}}\">{{p.name}}<\/span>\n<\/sc-if>\n<sc-if value=\"{{p.isNum}}\" hint-placeholder-val=\"{{ false }}\">\n<span class=\"pin-badge\" style=\"display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 50%; background: #F2C38B; color: #1A1208; font-weight: 600; font-size: 18px; {{p.ring}}\">{{p.num}}<\/span>\n<span class=\"pin-label\" style=\"padding: 4px 12px; border-radius: 999px; background: rgba(7, 13, 25, 0.88); font-size: 13px; font-weight: 500; white-space: nowrap\">{{p.name}}<\/span>\n<\/sc-if>\n<\/button>\n<\/sc-for>\n<\/div>\n<p style=\"margin: 12px 0 0; font-size: 14px; color: #9AA6BC\">Illustrative map, not to scale. Tap a place to read more.<\/p>\n<\/div>\n<div aria-live=\"polite\" style=\"flex: 1 1 320px; min-width: 0; padding: 32px; border-radius: 8px; background: #111C33; border: 1px solid rgba(201, 165, 90, 0.4)\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 500; color: #C9A55A\">{{pinKicker}}<\/p>\n<h3 style=\"margin: 8px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 34px; line-height: 1.1; font-weight: 600; color: #F3E4C4\">{{pinName}}<\/h3>\n<p style=\"margin: 14px 0 0; font-size: 17px; line-height: 1.65\">{{pinText}}<\/p>\n<sc-if value=\"{{pinHasLink}}\" hint-placeholder-val=\"{{ false }}\">\n<a href=\"{{pinLink}}\" style=\"display: inline-flex; align-items: center; min-height: 48px; margin-top: 20px; padding: 0 24px; border-radius: 999px; border: 1.5px solid #F3E4C4; color: #F3E4C4; text-decoration: none; font-weight: 500\">{{pinLinkLabel}}<\/a>\n<\/sc-if>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- 7. Meet the characters -->\n<section id=\"characters\" aria-labelledby=\"characters-title\" style=\"background: #0E1830\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: clamp(88px, 10vw, 120px) clamp(20px, 4.5vw, 64px)\">\n<div style=\"text-align: center\">\n<p style=\"margin: 0 0 14px; font-size: 15px; font-weight: 500; color: #F2A66E\">The cast<\/p>\n<h2 id=\"characters-title\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(40px, 4.8vw, 68px); line-height: 1.02; color: #F3E4C4\">Meet the characters<\/h2>\n<\/div>\n<p class=\"cast-hint\"><b>Tap a poster<\/b> to flip it and meet the actor.<\/p>\n<div class=\"castgrid\" style=\"margin-top: clamp(28px, 4vw, 44px)\">\n<figure style=\"margin: 0\">\n<div class=\"pcard\" role=\"button\" tabindex=\"0\" aria-pressed=\"false\" aria-label=\"Suzzane Soon, played by Kimberly Chan. Press to read about the actor.\" aria-describedby=\"bio-suzzane\">\n<div class=\"pcard-in\">\n<div class=\"pcard-face pcard-front\"><img src=\"images/cast-suzzane.webp\" alt=\"\" width=\"720\" height=\"960\" loading=\"lazy\"><span class=\"pcard-badge\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12a9 9 0 0 1 15.5-6.2L21 8\"/><path d=\"M21 3v5h-5\"/><path d=\"M21 12a9 9 0 0 1-15.5 6.2L3 16\"/><path d=\"M3 21v-5h5\"/><\/svg><\/span><\/div>\n<div class=\"pcard-face pcard-back pcard-long pcard-tabbed\"><p class=\"pcard-name\">Suzzane Soon<\/p><p class=\"pcard-by\">Played by Kimberly Chan<\/p><div class=\"pcard-tabs\"><button type=\"button\" class=\"pcard-tab on\" data-p=\"0\">Character<\/button><button type=\"button\" class=\"pcard-tab\" data-p=\"1\">Actor<\/button><\/div><div class=\"pcard-panels\"><div class=\"pcard-panel on\"><p class=\"pcard-desc\">A hopeful, resilient young woman from a noble Peranakan family, left behind by her family before the war. She has survived by following strict rules: stay inside, keep quiet, blend in.<\/p><\/div><div class=\"pcard-panel\"><p class=\"pcard-bio\" id=\"bio-suzzane\">Kim debuted as an actor in 2022 for The Best Nyonya and after multiple shows with Krate, she is back! An illustrator by profession, she has commissioned and published works that have appeared in international publications and online platforms.<\/p><\/div><\/div><\/div>\n<\/div>\n<\/div>\n<\/figure>\n<figure style=\"margin: 0\">\n<div class=\"pcard\" role=\"button\" tabindex=\"0\" aria-pressed=\"false\" aria-label=\"Tom Takamura Richards, played by Elijah Skye. Press to read about the actor.\" aria-describedby=\"bio-tom\">\n<div class=\"pcard-in\">\n<div class=\"pcard-face pcard-front\"><img src=\"images/cast-tom.webp\" alt=\"\" width=\"720\" height=\"960\" loading=\"lazy\"><span class=\"pcard-badge\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12a9 9 0 0 1 15.5-6.2L21 8\"/><path d=\"M21 3v5h-5\"/><path d=\"M21 12a9 9 0 0 1-15.5 6.2L3 16\"/><path d=\"M3 21v-5h5\"/><\/svg><\/span><\/div>\n<div class=\"pcard-face pcard-back pcard-tabbed\"><p class=\"pcard-name\">Tom Takamura Richards<\/p><p class=\"pcard-by\">Played by Elijah Skye<\/p><div class=\"pcard-tabs\"><button type=\"button\" class=\"pcard-tab on\" data-p=\"0\">Character<\/button><button type=\"button\" class=\"pcard-tab\" data-p=\"1\">Actor<\/button><\/div><div class=\"pcard-panels\"><div class=\"pcard-panel on\"><p class=\"pcard-desc\">A man who has spent his life belonging nowhere. He survives the Occupation on his intelligence, staying strictly neutral, until he must decide what he is truly willing to fight for.<\/p><\/div><div class=\"pcard-panel\"><p class=\"pcard-bio\" id=\"bio-tom\">Avid in music and performing arts, Skye has been involved in more than 5 Krate theatre productions throughout his childhood and college years with Krate, looking to hone down on his skills.<\/p><\/div><\/div><\/div>\n<\/div>\n<\/div>\n<\/figure>\n<figure style=\"margin: 0\">\n<div class=\"pcard\" role=\"button\" tabindex=\"0\" aria-pressed=\"false\" aria-label=\"Neo Lan, played by Janey Shairan. Press to read about the actor.\" aria-describedby=\"bio-neo-lan\">\n<div class=\"pcard-in\">\n<div class=\"pcard-face pcard-front\"><img src=\"images/cast-neo-lan.webp\" alt=\"\" width=\"720\" height=\"960\" loading=\"lazy\"><span class=\"pcard-badge\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12a9 9 0 0 1 15.5-6.2L21 8\"/><path d=\"M21 3v5h-5\"/><path d=\"M21 12a9 9 0 0 1-15.5 6.2L3 16\"/><path d=\"M3 21v-5h5\"/><\/svg><\/span><\/div>\n<div class=\"pcard-face pcard-back pcard-long pcard-tabbed\"><p class=\"pcard-name\">Neo Lan / Amache<\/p><p class=\"pcard-by\">Played by Janey Shairan<\/p><div class=\"pcard-tabs\"><button type=\"button\" class=\"pcard-tab on\" data-p=\"0\">Character<\/button><button type=\"button\" class=\"pcard-tab\" data-p=\"1\">Actor<\/button><\/div><div class=\"pcard-panels\"><div class=\"pcard-panel on\"><p class=\"pcard-desc\">A maid left behind with Suzzane, and her fiercely protective housekeeper. Pragmatic and disciplined, she believes order, routine and staying hidden are the only ways to survive.<\/p><\/div><div class=\"pcard-panel\"><p class=\"pcard-bio\" id=\"bio-neo-lan\">Janey is a communications student with a deep passion for the arts. Trained locally as a traditional dancer and actor, she brings a unique flair to her performances. Stemming from a love for music and rhythm, Janey has a background as a state-level cheerleader, showcasing this vibrant energy and dedication on stage.<\/p><\/div><\/div><\/div>\n<\/div>\n<\/div>\n<\/figure>\n<figure style=\"margin: 0\">\n<div class=\"pcard\" role=\"button\" tabindex=\"0\" aria-pressed=\"false\" aria-label=\"Pakcik Sam, played by Naim Azmi. Press to read about the actor.\" aria-describedby=\"bio-pakcik-sam\">\n<div class=\"pcard-in\">\n<div class=\"pcard-face pcard-front\"><img src=\"images/cast-pakcik-sam.webp\" alt=\"\" width=\"720\" height=\"960\" loading=\"lazy\"><span class=\"pcard-badge\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12a9 9 0 0 1 15.5-6.2L21 8\"/><path d=\"M21 3v5h-5\"/><path d=\"M21 12a9 9 0 0 1-15.5 6.2L3 16\"/><path d=\"M3 21v-5h5\"/><\/svg><\/span><\/div>\n<div class=\"pcard-face pcard-back pcard-long pcard-tabbed\"><p class=\"pcard-name\">Pakcik Sam / Cik Samsul<\/p><p class=\"pcard-by\">Played by Naim Azmi<\/p><div class=\"pcard-tabs\"><button type=\"button\" class=\"pcard-tab on\" data-p=\"0\">Character<\/button><button type=\"button\" class=\"pcard-tab\" data-p=\"1\">Actor<\/button><\/div><div class=\"pcard-panels\"><div class=\"pcard-panel on\"><p class=\"pcard-desc\">The neighbour&rsquo;s housekeeper. Kind, protective and careful, he brings Neo Lan and Sue news of what is happening outside their walls.<\/p><\/div><div class=\"pcard-panel\"><p class=\"pcard-bio\" id=\"bio-pakcik-sam\">Originally from Kuala Lumpur and now based in the state of Melaka, Naim is active in cultural arts and vocal performances for the big stage. A &ldquo;serious&rdquo; person on the outside, but...watch out! Naim has a &ldquo;witty and humorous&rdquo; personality that naturally draws people in.<\/p><\/div><\/div><\/div>\n<\/div>\n<\/div>\n<\/figure>\n<figure style=\"margin: 0\">\n<div class=\"pcard\" role=\"button\" tabindex=\"0\" aria-pressed=\"false\" aria-label=\"General Koji, played by Francis Augustine. Press to read about the actor.\" aria-describedby=\"bio-general-koji\">\n<div class=\"pcard-in\">\n<div class=\"pcard-face pcard-front\"><img src=\"images/cast-general-koji.webp\" alt=\"\" width=\"720\" height=\"960\" loading=\"lazy\"><span class=\"pcard-badge\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12a9 9 0 0 1 15.5-6.2L21 8\"/><path d=\"M21 3v5h-5\"/><path d=\"M21 12a9 9 0 0 1-15.5 6.2L3 16\"/><path d=\"M3 21v-5h5\"/><\/svg><\/span><\/div>\n<div class=\"pcard-face pcard-back pcard-long pcard-tabbed\"><p class=\"pcard-name\">General Koji<\/p><p class=\"pcard-by\">Played by Francis Augustine<\/p><div class=\"pcard-tabs\"><button type=\"button\" class=\"pcard-tab on\" data-p=\"0\">Character<\/button><button type=\"button\" class=\"pcard-tab\" data-p=\"1\">Actor<\/button><\/div><div class=\"pcard-panels\"><div class=\"pcard-panel on\"><p class=\"pcard-desc\">The calculating and ruthless leader of the occupying Imperial Japanese forces. Unflinching and disciplined, he commands his men with absolute authority and personally oversees every interrogation.<\/p><\/div><div class=\"pcard-panel\"><p class=\"pcard-bio\" id=\"bio-general-koji\">Francis Augustine Soosay, advocate &amp; solicitor / lawyer and sole proprietor of Francis Augustine Law Chambers and former professor of law in Multimedia University, Melaka. His experience in the arts includes years of symphonic and choral music involvement as conductor, composer and musician. This is his second major production in theatre, with Krate. His first foray in theatre was under the tutelage of the late Mr Mano Maniam.<\/p><\/div><\/div><\/div>\n<\/div>\n<\/div>\n<\/figure>\n<figure style=\"margin: 0\">\n<div class=\"pcard\" role=\"button\" tabindex=\"0\" aria-pressed=\"false\" aria-label=\"Youske, played by Terrell Wu. Press to read about the actor.\" aria-describedby=\"bio-youske\">\n<div class=\"pcard-in\">\n<div class=\"pcard-face pcard-front\"><img src=\"images/cast-youske.webp\" alt=\"\" width=\"720\" height=\"960\" loading=\"lazy\"><span class=\"pcard-badge\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12a9 9 0 0 1 15.5-6.2L21 8\"/><path d=\"M21 3v5h-5\"/><path d=\"M21 12a9 9 0 0 1-15.5 6.2L3 16\"/><path d=\"M3 21v-5h5\"/><\/svg><\/span><\/div>\n<div class=\"pcard-face pcard-back pcard-long pcard-tabbed\"><p class=\"pcard-name\">Youske<\/p><p class=\"pcard-by\">Played by Terrell Wu<\/p><div class=\"pcard-tabs\"><button type=\"button\" class=\"pcard-tab on\" data-p=\"0\">Character<\/button><button type=\"button\" class=\"pcard-tab\" data-p=\"1\">Actor<\/button><\/div><div class=\"pcard-panels\"><div class=\"pcard-panel on\"><p class=\"pcard-kicker\">The Japanese Soldiers / Voices (Ensemble)<\/p><p class=\"pcard-desc\">A multi-roled ensemble representing the constant threat of the Occupation. Through heavy boots, sharp orders, and sudden violence, often heard before they are seen, they embody the oppressive weight of wartime rule.<\/p><\/div><div class=\"pcard-panel\"><p class=\"pcard-bio\" id=\"bio-youske\">Terrell Wu is a Malaysian actor, singer, and all-round theatre enthusiast who spent his university years performing in Hawaii. His stage credits include Mamma Mia! (2022), Joseph and the Amazing Technicolor Dreamcoat as Asher, and Cyrano de Bergerac in the title role (2023). Having enjoyed the magic and occasional chaos of theatre both onstage and behind the scenes, Terrell is excited to bring this production to life and bring theatre to the heart of historic Melaka.<\/p><\/div><\/div><\/div>\n<\/div>\n<\/div>\n<\/figure>\n<figure style=\"margin: 0\">\n<div class=\"pcard\" role=\"button\" tabindex=\"0\" aria-pressed=\"false\" aria-label=\"Daiki, played by Amir Ise. Press to read about the actor.\" aria-describedby=\"bio-daiki\">\n<div class=\"pcard-in\">\n<div class=\"pcard-face pcard-front\"><img src=\"images/cast-daiki.webp\" alt=\"\" width=\"720\" height=\"960\" loading=\"lazy\"><span class=\"pcard-badge\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12a9 9 0 0 1 15.5-6.2L21 8\"/><path d=\"M21 3v5h-5\"/><path d=\"M21 12a9 9 0 0 1-15.5 6.2L3 16\"/><path d=\"M3 21v-5h5\"/><\/svg><\/span><\/div>\n<div class=\"pcard-face pcard-back pcard-long pcard-tabbed\"><p class=\"pcard-name\">Daiki<\/p><p class=\"pcard-by\">Played by Amir Ise<\/p><div class=\"pcard-tabs\"><button type=\"button\" class=\"pcard-tab on\" data-p=\"0\">Character<\/button><button type=\"button\" class=\"pcard-tab\" data-p=\"1\">Actor<\/button><\/div><div class=\"pcard-panels\"><div class=\"pcard-panel on\"><p class=\"pcard-kicker\">The Japanese Soldiers / Voices (Ensemble)<\/p><p class=\"pcard-desc\">A multi-roled ensemble representing the constant threat of the Occupation. Through heavy boots, sharp orders, and sudden violence, often heard before they are seen, they embody the oppressive weight of wartime rule.<\/p><\/div><div class=\"pcard-panel\"><p class=\"pcard-bio\" id=\"bio-daiki\">Amir Ise is a seasoned creative professional with over two decades of experience in acting, theatre, TV, film, and production. He is also a Real Estate Negotiator with IQI Realty, bringing his communication and networking skills to the property industry while actively contributing to Melaka&rsquo;s arts scene.<\/p><\/div><\/div><\/div>\n<\/div>\n<\/div>\n<\/figure>\n<figure style=\"margin: 0\">\n<div class=\"pcard\" role=\"button\" tabindex=\"0\" aria-pressed=\"false\" aria-label=\"Sergeant John, played by Karam Tabba. Press to read about the actor.\" aria-describedby=\"bio-sgt-john\">\n<div class=\"pcard-in\">\n<div class=\"pcard-face pcard-front\"><img src=\"images/cast-sgt-john.webp\" alt=\"\" width=\"720\" height=\"960\" loading=\"lazy\"><span class=\"pcard-badge\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12a9 9 0 0 1 15.5-6.2L21 8\"/><path d=\"M21 3v5h-5\"/><path d=\"M21 12a9 9 0 0 1-15.5 6.2L3 16\"/><path d=\"M3 21v-5h5\"/><\/svg><\/span><\/div>\n<div class=\"pcard-face pcard-back pcard-long pcard-tabbed\"><p class=\"pcard-name\">Sergeant John<\/p><p class=\"pcard-by\">Played by Karam Tabba<\/p><div class=\"pcard-tabs\"><button type=\"button\" class=\"pcard-tab on\" data-p=\"0\">Character<\/button><button type=\"button\" class=\"pcard-tab\" data-p=\"1\">Actor<\/button><\/div><div class=\"pcard-panels\"><div class=\"pcard-panel on\"><p class=\"pcard-desc\">A British sergeant and Tom&rsquo;s commanding officer who operates under intense pressure. Loyal to the mission, he orders Tom to seek out Baba Soon Teck when the camp is compromised, ultimately paying a heavy price for his resistance under interrogation.<\/p><\/div><div class=\"pcard-panel\"><p class=\"pcard-bio\" id=\"bio-sgt-john\">Originally from Syria, Karam has called Malaysia home for over a decade, and his theatre journey began right here in Melaka. Since then he has acted in over 25 productions and written more than 20 plays, and won Best Script at Short+Sweet 2019. A programme manager in AI by profession, he&rsquo;s back with Krate for Tears Under The Rising Sun... Going back to where it all started.<\/p><\/div><\/div><\/div>\n<\/div>\n<\/div>\n<\/figure>\n<\/div>\n<div class=\"cast-track\" aria-hidden=\"true\"><i><\/i><\/div>\n<\/div>\n<\/section>\n\n<!-- 8. Songs -->\n<section id=\"songs\" aria-labelledby=\"songs-title\" style=\"position: relative; overflow: hidden; background: #070D19\">\n<img src=\"/_blob/6ed54ef91f8f9794b59d391c36e02720\" alt=\"\" aria-hidden=\"true\" style=\"position: absolute; top: 0; left: 0; width: 100%; height: 900px; object-fit: cover; object-position: center top; -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent); mask-image: linear-gradient(to bottom x); line-height: 1.05; font-weight: 600; color: #F3E4C4\">More from life under occupation<\/h3>\n<p style=\"margin: 12px 0 0; font-size: 15px; color: #9AA6BC\">Tap a card to learn what it meant.<\/p>\n<\/div>\n<sc-for list=\"{{bonus}}\" as=\"it\" hint-placeholder-count=\"5\">\n<button type=\"button\" class=\"spotcard\" onClick=\"{{it.toggle}}\" aria-pressed=\"{{it.pressed}}\" aria-label=\"{{it.label}}\" style=\"position: relative; display: block; width: 100%; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; perspective: 1400px\">\n<span class=\"flip\" style=\"position: absolute; inset: 0; display: block; transform-style: preserve-3d; transform: rotateY({{it.rot}}deg)\">\n<span class=\"spot-front\" style=\"position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 22px; border-radius: 12px; background: linear-gradient(165deg, #17243F, #0E1830 70%); border: 1px solid rgba(201, 165, 90, 0.42); box-shadow: 0 14px 30px rgba(0, 0, 0, 0.25); -webkit-backface-visibility: hidden; backface-visibility: hidden\">\n<span style=\"display: flex; justify-content: space-between; align-items: flex-start\"><svg aria-hidden=\"true\" width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F2C38B\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{it.icon}}\"><\/path><\/svg><span style=\"font-size: 13px; letter-spacing: 0.08em; color: #7F8BA3\">{{it.num}}<\/span><\/span>\n<span><span style=\"display: block; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(24px, 2.2vw, 30px); font-weight: 600; line-height: 1.08; color: #F3E4C4\">{{it.term}}<\/span><span style=\"display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 13px; color: #9AA6BC\"><span aria-hidden=\"true\" style=\"color: #F2A66E\">\u25c6<\/span>{{it.hint}}<\/span><\/span>\n<\/span>\n<span aria-hidden=\"{{it.backHidden}}\" style= tion team<\/h2>\n<\/div>\n<div style=\"max-width: 280px; margin: clamp(40px, 5vw, 56px) auto 0\">\n<figure style=\"margin: 0; text-align: center\">\n<div class=\"pcard crew\" role=\"button\" tabindex=\"0\" aria-pressed=\"false\" aria-label=\"Wee Shyre May, Writer, producer and director. Press to read their bio.\" aria-describedby=\"bio-wee-shyre-may\">\n<div class=\"pcard-in\">\n<div class=\"pcard-face pcard-front\"><img src=\"images/crew-shyre-may.webp\" alt=\"\" width=\"720\" height=\"960\" loading=\"lazy\" style=\"object-position: 50% 28%\"><span class=\"pcard-badge\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12a9 9 0 0 1 15.5-6.2L21 8\"/><path d=\"M21 3v5h-5\"/><path d=\"M21 12a9 9 0 0 1-15.5 6.2L3 16\"/><path d=\"M3 21v-5h5\"/><\/svg><\/span><\/div>\n<div class=\"pcard-face pcard-back\"><p class=\"pcard-name\">Wee Shyre May<\/p><p class=\"pcard-by\">Writer, producer and director<\/p><p class=\"pcard-bio\" id=\"bio-wee-shyre-may\">Shyre May is the Founder of Krate &ndash; A Creative Space and Cafe which focuses on the performing arts community based in Melaka. Recently trained in NYC and with 10 years of experience in the industry, she has written, produced, directed and acted in many original plays, commercials and independent films.<\/p><\/div>\n<\/div>\n<\/div>\n<figcaption style=\"margin-top: 16px\"><span style=\"display: block; font-size: 14px; letter-spacing: 0.04em; color: #F2A66E\">Writer, producer and director<\/span><a href=\"https://www.shyremay.com.my\" target=\"_blank\" rel=\"noopener\" style=\"display: block; margin-top: 4px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(30px, 3vw, 40px); font-weight: 600; line-height: 1.12; color: #F3E4C4; text-decoration: underline; text-decoration-color: rgba(242, 166, 110, 0.6); text-underline-offset: 6px\">Wee Shyre May<\/a><\/figcaption>\n<\/figure>\n<p style=\"margin: 12px 0 0; text-align: center; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 19px; line-height: 1.4; color: #D9DFEA\">\u201cWe create immersive theatre that celebrates Malaysian culture.\u201d<\/p>\n<\/div>\n<div class=\"crewgrid\" style=\"margin-top: clamp(40px, 5vw, 56px)\">\n<figure style=\"margin: 0; text-align: center\">\n<div class=\"pcard crew\" role=\"button\" tabindex=\"0\" aria-pressed=\"false\" aria-label=\"Yohan Nadav, Sound engineer, music producer and composer. Press to read their bio.\" aria-describedby=\"bio-yohan-nadav\">\n<div class=\"pcard-in\">\n<div class=\"pcard-face pcard-front\" style=\"background-image: url(/_blob/4560010a4f0de23635245737c0267c3e); background-size: 500% 100%; background-position: 25% 0%\"><span class=\"pcard-badge\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12a9 9 0 0 1 15.5-6.2L21 8\"/><path d=\"M21 3v5h-5\"/><path d=\"M21 12a9 9 0 0 1-15.5 6.2L3 16\"/><path d=\"M3 21v-5h5\"/><\/svg><\/span><\/div>\n<div class=\"pcard-face pcard-back pcard-long\"><p class=\"pcard-name\">Yohan Nadav<\/p><p class=\"pcard-by\">Sound engineer, music producer and composer<\/p><p class=\"pcard-bio\" id=\"bio-yohan-nadav\">Yohan Nadav, also known as The Music Guy (TMG), is a passionate music creator, performer, and producer with expertise in live performances and creative sound production. He is dedicated to crafting high-quality compositions and arrangements that move audiences across diverse musical genres.<\/p><\/div>\n<\/div>\n<\/div>\n<figcaption style=\"margin-top: 16px\"><span style=\"display: block; font-size: 14px; letter-spacing: 0.04em; color: #F2A66E\">Sound engineer, music producer and composer<\/span><span style=\"display: block; margin-top: 4px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(22px, 2vw, 27px); font-weight: 600; line-height: 1.12; color: #F3E4C4\">Yohan Nadav (TMG)<\/span><\/figcaption>\n<\/figure>\n<figure style=\"margin: 0; text-align: center\">\n<div class=\"pcard crew\" role=\"button\" tabindex=\"0\" aria-pressed=\"false\" aria-label=\"Benjamin Yong, Sound designer. Press to read their bio.\" aria-describedby=\"bio-benjamin-yong\">\n<div class=\"pcard-in\">\n<div class=\"pcard-face pcard-front\" style=\"background-image: url(/_blob/4560010a4f0de23635245737c0267c3e); background-size: 500% 100%; background-position: 50% 0%\"><span class=\"pcard-badge\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12a9 9 0 0 1 15.5-6.2L21 8\"/><path d=\"M21 3v5h-5\"/><path d=\"M21 12a9 9 0 0 1-15.5 6.2L3 16\"/><path d=\"M3 21v-5h5\"/><\/svg><\/span><\/div>\n<div class=\"pcard-face pcard-back\"><p class=\"pcard-name\">Benjamin Yong<\/p><p class=\"pcard-by\">Sound designer<\/p><p class=\"pcard-bio\" id=\"bio-benjamin-yong\">A founding member of Krate, Benjamin is passionate about music and the technicalities of stage production, specialising in light and sound.<\/p><\/div>\n<\/div>\n<\/div>\n<figcaption style=\"margin-top: 16px\"><span style=\"display: block; font-size: 14px; letter-spacing: 0.04em; color: #F2A66E\">Sound designer<\/span><span style=\"display: block; margin-top: 4px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(22px, 2vw, 27px); font-weight: 600; line-height: 1.12; color: #F3E4C4\">Benjamin Yong<\/span><\/figcaption>\n<\/figure>\n<figure style=\"margin: 0; text-align: center\">\n<div class=\"pcard crew\" role=\"button\" tabindex=\"0\" aria-pressed=\"false\" aria-label=\"MJ Gan, Stage manager. Press to read their bio.\" aria-describedby=\"bio-mj-gan\">\n<div class=\"pcard-in\">\n<div class=\"pcard-face pcard-front\" style=\"background-image: url(/_blob/4560010a4f0de23635245737c0267c3e); background-size: 500% 100%; background-position: 75% 0%\"><span class=\"pcard-badge\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12a9 9 0 0 1 15.5-6.2L21 8\"/><path d=\"M21 3v5h-5\"/><path d=\"M21 12a9 9 0 0 1-15.5 6.2L3 16\"/><path d=\"M3 21v-5h5\"/><\/svg><\/span><\/div>\n<div class=\"pcard-face pcard-back\"><p class=\"pcard-name\">MJ Gan<\/p><p class=\"pcard-by\">Stage manager<\/p><p class=\"pcard-bio\" id=\"bio-mj-gan\">MJ began her journey in theatre as a backstage crew member for Krate Production&rsquo;s The Case of the Missing Diamond in 2023. She now oversees scheduling, production, and stage management.<\/p><\/div>\n<\/div>\n<\/div>\n<figcaption style=\"margin-top: 16px\"><span style=\"display: block; font-size: 14px; letter-spacing: 0.04em; color: #F2A66E\">Stage manager<\/span><span style=\"display: block; margin-top: 4px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(22px, 2vw, 27px); font-weight: 600; line-height: 1.12; color: #F3E4C4\">MJ Gan<\/span><\/figcaption>\n<\/figure>\n<figure style=\"margin: 0; text-align: center\">\n<div class=\"pcard crew\" role=\"button\" tabindex=\"0\" aria-pressed=\"false\" aria-label=\"Neena Shu, Props master. Press to read their bio.\" aria-describedby=\"bio-neena-shu\">\n<div class=\"pcard-in\">\n<div class=\"pcard-face pcard-front\" style=\"background-image: url(/_blob/4560010a4f0de23635245737c0267c3e); background-size: 500% 100%; background-position: 100% 0%\"><span class=\"pcard-badge\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12a9 9 0 0 1 15.5-6.2L21 8\"/><path d=\"M21 3v5h-5\"/><path d=\"M21 12a9 9 0 0 1-15.5 6.2L3 16\"/><path d=\"M3 21v-5h5\"/><\/svg><\/span><\/div>\n<div class=\"pcard-face pcard-back\"><p class=\"pcard-name\">Neena Shu<\/p><p class=\"pcard-by\">Props master<\/p><p class=\"pcard-bio\" id=\"bio-neena-shu\">A multi-talented artist who specialises in dance, Neena has been involved in the performing arts industry since 2017 and a key member of Krate since 2020.<\/p><\/div>\n<\/div>\n<\/div>\n<figcaption style=\"margin-top: 16px\"><span style=\"display: block; font-size: 14px; letter-spacing: 0.04em; color: #F2A66E\">Props master<\/span><span style=\"display: block; margin-top: 4px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(22px, 2vw, 27px); font-weight: 600; line-height: 1.12; color: #F3E4C4\">Neena Shu<\/span><\/figcaption>\n<\/figure>\n<\/div>\n<div class=\"crewlists\" style=\"margin-top: clamp(56px, 6vw, 72px)\">\n<div><h3 style=\"margin: 0 0 6px; font-size: 14px; letter-spacing: 0.08em; font-weight: 500; color: #F2A66E\">Production<\/h3><dl style=\"margin: 0\"><div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 11px 0; border-bottom: 1px dotted rgba(201, 165, 90, 0.4)\"><dt style=\"font-size: 15px; color: #9AA6BC\">Tech manager<\/dt><dd style=\"margin: 0; font-size: 17px; font-weight: 600; color: #F3E4C4; text-align: right\">Jevinkumar<\/dd><\/div>\n<div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 11px 0; border-bottom: 1px dotted rgba(201, 165, 90, 0.4)\"><dt style=\"font-size: 15px; color: #9AA6BC\">Tech team<\/dt><dd style=\"margin: 0; font-size: 17px; font-weight: 600; color: #F3E4C4; text-align: right\">Hazeeq Rahim Enterprise<\/dd><\/div>\n<div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 11px 0; border-bottom: 1px dotted rgba(201, 165, 90, 0.4)\"><dt style=\"font-size: 15px; color: #9AA6BC\">Costumes<\/dt><dd style=\"margin: 0; font-size: 17px; font-weight: 600; color: #F3E4C4; text-align: right\">Tracy Anne<\/dd><\/div>\n<div st gap: 48px 88px\">\n<div style=\"flex: 1.2 1 460px; min-width: 0\">\n<p style=\"margin: 0 0 14px; font-size: 15px; font-weight: 500; color: #F2A66E\">About Krate<\/p>\n<h2 id=\"krate-title\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(40px, 4.8vw, 68px); line-height: 1.02\">Melaka\u2019s first independent creative community<\/h2>\n<p style=\"margin: 24px 0 0; font-size: 18px; line-height: 1.7; color: #D5E0DC\">Established in 2016, Krate specialises in customised interactive and multi-disciplinary performances. From intimate black box productions to site-specific walk-through theatre and full-scale original musicals, our work blends theatre, music and movement with local narratives.<\/p>\n<a href=\"https://www.krate.com.my/\" style=\"display: inline-flex; align-items: center; min-height: 52px; margin-top: 32px; padding: 0 28px; border-radius: 999px; background: #C9A55A; color: #0E2B27; text-decoration: none; font-weight: 600\">Visit krate.com.my<\/a>\n<\/div>\n<div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n<div style=\"border-top: 1px solid #C9A55A; padding-top: 14px\"><p style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 48px; line-height: 1; font-weight: 600\">10+<\/p><p style=\"margin: 6px 0 0; color: #A9BDB7\">Original productions since 2016<\/p><\/div>\n<div style=\"border-top: 1px solid #C9A55A; padding-top: 14px\"><p style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 48px; line-height: 1; font-weight: 600\">18 shows<\/p><p style=\"margin: 6px 0 0; color: #A9BDB7\">The Great Gossip\u2019s record sell-out run, in under two weeks<\/p><\/div>\n<div style=\"border-top: 1px solid #C9A55A; padding-top: 14px\"><p style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 48px; line-height: 1; font-weight: 600\">3 cities<\/p><p style=\"margin: 6px 0 0; color: #A9BDB7\">Melaka, Kuala Lumpur and Penang<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- 14. Partnerships and collaborations -->\n<section aria-labelledby=\"partners-title\" style=\"background: #0A1222\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 88px clamp(20px, 4.5vw, 64px)\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 48px\">\n<h2 id=\"partners-title\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(36px, 4vw, 56px); line-height: 1.05; color: #F3E4C4\">Partnerships and collaborations<\/h2>\n<p style=\"margin: 0; max-width: 40ch; color: #9AA6BC\">Brands, festivals and institutions Krate has worked with over the years.<\/p>\n<\/div>\n<div style=\"margin-top: 32px; padding: clamp(16px, 3vw, 32px); border-radius: 8px; background: #FFFFFF\">\n<img src=\"/_blob/f2770919fd451c2807e38cac03a2138a\" alt=\"Logos including Infineon, MAE by Maybank, OCBC Bank, The Chow Kit, TEDxJonkerStreet and Riuh\" style=\"width: 100%\">\n<\/div>\n<\/div>\n<\/section>\n\n<!-- 15. In the news -->\n<section id=\"news\" aria-labelledby=\"news-title\" style=\"background: #0E1830\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 104px clamp(20px, 4.5vw, 64px)\">\n<p id=\"news-title\" style=\"margin: 0 0 32px; font-size: 15px; font-weight: 500; color: #F2A66E\">In the news<\/p>\n<article style=\"max-width: 900px; margin: 0 auto; padding: clamp(28px, 5vw, 56px); background: #EFE6D2; color: #1B1A17; border-radius: 2px; transform: rotate(-0.6deg); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35)\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 24px; padding-bottom: 14px; border-bottom: 3px double #1B1A17\">\n<span style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: 34px; font-weight: 700\">The Star<\/span>\n<span style=\"font-size: 15px; color: #4A473F\">Arts, Saturday 7 November 2026<\/spa \n<span style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(28px, 2.6vw, 34px); line-height: 1.08; font-weight: 600\">Ten years of original theatre.<\/span>\n<span style=\"margin-top: 10px; font-size: 15px; color: #9AA6BC\">More than ten productions since 2016.<\/span>\n<span style=\"display: inline-flex; align-self: flex-start; align-items: center; min-height: 46px; margin-top: 22px; padding: 0 22px; border-radius: 999px; background: #F2C38B; color: #1A1208; font-weight: 600\">See them all<\/span>\n<\/a>\n<\/div>\n<\/section>\n\n<!-- 18. Reviews and feedback -->\n<section aria-labelledby=\"reviews-title\" style=\"background: #0E1830; overflow: hidden\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: clamp(88px, 10vw, 120px) clamp(20px, 4.5vw, 64px) 0; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px 48px\">\n<div style=\"flex: 1 1 480px; min-width: 0\"><p style=\"margin: 0 0 14px; font-size: 15px; font-weight: 500; color: #F2A66E\">From our audiences<\/p><h2 id=\"reviews-title\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(40px, 4.8vw, 68px); line-height: 1.02; color: #F3E4C4\">What people said last time<\/h2><\/div>\n<div style=\"display: flex; gap: 12px\"><button type=\"button\" onClick=\"{{slidePrev}}\" aria-label=\"Previous reviews\" style=\"display: flex; align-items: center; justify-content: center; width: 54px; height: 54px; border-radius: 50%; border: 1.5px solid rgba(243, 228, 196, 0.5); background: transparent; color: #F3E4C4; cursor: pointer\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\/path><\/svg><\/button><button type=\"button\" onClick=\"{{slideNext}}\" aria-label=\"Next reviews\" style=\"display: flex; align-items: center; justify-content: ce p-align: start; display: flex; flex-direction: column; margin: 0; padding: clamp(26px, 3vw, 36px); border-radius: 14px; background: linear-gradient(165deg, #17243F, #0E1830 75%); border: 1px solid rgba(201, 165, 90, 0.35)\">\n<span aria-hidden=\"true\" style=\"display: block; height: 44px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 96px; line-height: 0.9; color: #F2A66E\">\u201c<\/span>\n<blockquote style=\"margin: 14px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(22px, 2vw, 27px); line-height: 1.3; font-weight: 500; color: #F3E4C4\">It was really entertaining and brilliantly executed\u2026 We laughed, teared a bit and felt the emotions that were delivered.<\/blockquote>\n<figcaption style=\"margin-top: auto; padding-top: 24px; font-size: 15px; color: #9AA6BC\"><span style=\"display: block; font-weight: 600; color: #F2C38B\">Audience member<\/span>The Great Gossip<\/figcaption>\n<\/figure>\n<figure style=\"flex: 0 0 clamp(290px, 34vw, 440px); scroll-snap-align: start; display: flex; flex-direction: column; margin: 0; padding: clamp(26px, 3vw, 36px); border-radius: 14px; background: linear-gradient(165deg, #17243F, #0E1830 75%); border: 1px solid rgba(201, 165, 90, 0.35)\">\n<span aria-hidden=\"true\" style=\"display: block; height: 44px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 96px; line-height: 0.9; color: #F2A66E\">\u201c<\/span>\n<blockquote style=\"margin: 14px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(22px, 2vw, 27px); line-height: 1.3; font-weight: 500; color: #F3E4C4\">Such a wonderful local production, featuring such a talented, all-female cast. It\u2019s a must see!<\/blockquote>\n<figcaption style=\"margin-top: auto; padding-top: 24px; font-size: 15px; color: #9AA6BC\"><span style=\"display: block; font-weight: 600; color: #F2C38B\">Audience member<\/span>The Best Nyonya<\/figcaption>\n<\/figure>\n<figure style=\"flex: 0 0 clamp(290px, 34vw, 440px); scroll-s
